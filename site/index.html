<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Diff</title>
  <meta name="description" content="AI coding agents, AI policy and the data engineering stack, every morning.">
  <meta name="theme-color" content="#0E1110">
  <link rel="icon" href="./favicon-16.svg" type="image/svg+xml">
  <!-- apple-touch-icon.png and feed-icon.png are PNG renders of favicon.svg, og-image.png sets it beside the wordmark: iOS, link previews and RSS take no SVG. og:image needs an absolute URL. -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily Diff">
  <meta property="og:description" content="AI coding agents, AI policy and the data engineering stack, every morning.">
  <meta property="og:url" content="https://dboeter.github.io/daily-diff/">
  <meta property="og:image" content="https://dboeter.github.io/daily-diff/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="daily diff: a plus over a minus in a diff gutter, beside the wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Before the stylesheet, so the page never paints in the other theme. The reader's own
       choice (the theme button) is stored in dd-theme; without one the page follows the system.
       The page before this one stored ar-theme on every visit, "dark" by default, so there
       only "light" was a choice: it is kept, a stored "dark" is not. -->
  <script>
    (() => {
      let stored = null;
      try {
        stored = localStorage.getItem('dd-theme') ?? (localStorage.getItem('ar-theme') === 'light' ? 'light' : null);
      } catch { /* storage blocked: follow the system */ }
      const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Plex Serif is the Weekly Diff article's face only: its italics mark interpretation, and a serif italic is easier to tell from the upright than a sans one. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="Daily Diff RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    /* Green and red mean added and going away (the diff gutter of a Highlights list); nothing
       else uses them: the selected day, tab and search hit are ink or the link color.
       --dim is for rules and scrollbars only: it fails contrast as text. */
    :root {
      /* Native controls (the search field's clear button, scrollbars) follow the theme. */
      color-scheme: dark;
      --bg:             #0E1110;
      --surface:        #131716;
      --raised:         #1A1F1C;
      --rule:           #262D29;
      --text:           #DCE3DE;
      --muted:          #8C968F;
      --dim:            #3A423D;
      --added:          #4CC38A;
      --added-bg:       rgba(76,195,138,0.09);
      --added-gutter:   rgba(76,195,138,0.17);
      --removed:        #F0716A;
      --removed-bg:     rgba(240,113,106,0.09);
      --removed-gutter: rgba(240,113,106,0.17);
      --link:           #8DBBFF;
      --found:          rgba(141,187,255,0.28);
      --backdrop:       rgba(0,0,0,0.6);
      /* The mark stays a dark tile in both themes: its green and red are fixed (logo colors). */
      --mark-bg:        #1A1F1C;
      --code-bg:        color-mix(in srgb, var(--text) 8%, transparent);
      --sans:  'IBM Plex Sans', system-ui, sans-serif;
      --mono:  'IBM Plex Mono', ui-monospace, monospace;
      --serif: 'IBM Plex Serif', Georgia, serif;
      /* The sticky top: the bar and the tabs. Headings scroll to just under it. */
      --bar-h:  52px;
      --tabs-h: 44px;
      --top-h:  calc(var(--bar-h) + var(--tabs-h));
      /* The diff gutter's width: the sign column of a Highlights list. */
      --gutter: 48px;
    }
    [data-theme="light"] {
      --bg:             #F5F7F5;
      --surface:        #FFFFFF;
      --raised:         #EBEEEB;
      --rule:           #D8DDD8;
      --text:           #151917;
      --muted:          #59625C;
      --dim:            #C4C8C0;
      color-scheme: light;
      /* The signs are darker than the mark's green and red: 4.5:1 on their gutter tints. */
      --added:          #146C42;
      --added-bg:       #EDF7F1;
      --added-gutter:   #D6EEDF;
      --removed:        #A83028;
      --removed-bg:     #FCEFED;
      --removed-gutter: #F7DAD6;
      --link:           #1F5FBF;
      --found:          rgba(31,95,191,0.16);
      --backdrop:       rgba(21,25,23,0.35);
      --mark-bg:        #151917;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    /* The scrollbar's width stays reserved, so the page does not shift when a dialog locks scrolling. */
    html { scroll-padding-top: calc(var(--top-h) + 20px); scrollbar-gutter: stable; }
    html:has(dialog[open]) { overflow: hidden; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
    /* A heading that code moved the focus to (a new page, a contents jump) shows no ring. */
    h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, h3[tabindex="-1"]:focus { outline: none; }
    /* The first Tab stop: past the bar and the tabs, to the page. Shown only while focused. */
    #skipBtn {
      position: fixed; left: 12px; top: -60px; z-index: 20; height: 36px; padding: 0 12px;
      border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); cursor: pointer;
    }
    #skipBtn:focus { top: 8px; }
    ::selection { background: var(--found); }
    /* A report's square (REPORTS color in src/core/strings.ts, manifest `colors`); set as --tile. */
    .tile {
      display: inline-block; flex-shrink: 0; width: 10px; height: 10px; border-radius: 2px;
      background: var(--tile, var(--muted));
    }
    /* The page's one container: the bar, the tabs, the page and the footer share its edges. */
    .wrap { max-width: 1136px; margin: 0 auto; padding: 0 32px; }

    /* ── Top: the bar (brand, day, actions) and the day's report tabs ── */
    #top { position: sticky; top: 0; z-index: 10; background: var(--bg); }
    #bar { border-bottom: 1px solid var(--rule); }
    .bar-in { display: flex; align-items: center; gap: 8px; height: var(--bar-h); }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-right: 20px;
      font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -0.03em;
      text-decoration: none; white-space: nowrap;
    }
    .mark { display: block; flex-shrink: 0; }
    .stepper { display: flex; align-items: center; gap: 2px; }
    .step, .act, #dayBtn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 34px; min-width: 34px; border-radius: 6px; cursor: pointer;
      background: none; border: 1px solid transparent; color: var(--muted);
      text-decoration: none; white-space: nowrap;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .step:hover, .act:hover, #dayBtn:hover { color: var(--text); background: var(--raised); }
    .step[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
    .step svg, .act svg, #dayBtn svg { display: block; flex-shrink: 0; }
    #dayBtn {
      padding: 0 10px; color: var(--text);
      font-family: var(--mono); font-size: 14px; font-weight: 500;
    }
    #dayBtn svg { color: var(--muted); }
    /* The newest run's tag. Not green: green means added. */
    .run-tag {
      padding: 0 6px; border: 1px solid var(--link); border-radius: 4px;
      font-family: var(--sans); font-size: 12px; font-weight: 500; line-height: 18px; color: var(--link);
    }
    .actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .act-search { padding: 0 10px; border-color: var(--rule); font-size: 14px; }
    .act-search kbd {
      font-family: var(--mono); font-size: 12px; line-height: 18px; padding: 0 5px;
      border: 1px solid var(--rule); border-radius: 4px;
    }
    /* The theme button shows the theme it switches to. */
    [data-theme="dark"] #themeBtn .icon-moon, [data-theme="light"] #themeBtn .icon-sun { display: none; }

    #tabs { border-bottom: 1px solid var(--rule); }
    .tabs-in {
      display: flex; align-items: stretch; gap: 0 24px; height: var(--tabs-h);
      overflow-x: auto; scrollbar-width: none; font-size: 14px;
    }
    .tabs-in::-webkit-scrollbar { display: none; }
    /* More tabs than fit (a phone, an archive day of eight reports): the edge with more fades. */
    .tabs-in { --fade-l: 0px; --fade-r: 0px; mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent); }
    .tabs-in.more-left { --fade-l: 48px; }
    .tabs-in.more-right { --fade-r: 48px; }
    .tab {
      display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
      padding-top: 2px; border-bottom: 2px solid transparent;
      color: var(--muted); text-decoration: none; white-space: nowrap;
      transition: color 0.12s;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-current] { color: var(--text); font-weight: 600; border-bottom-color: var(--tile, var(--text)); }
    .tab time { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
    /* The latest weekly pages, pinned at the end of the tabs while they are of another day. */
    .tabs-pin {
      display: flex; align-items: stretch; gap: 0 24px; flex-shrink: 0;
      margin-left: auto; padding-left: 24px; border-left: 1px solid var(--rule);
    }
    .tabs-pin > span { align-self: center; font-size: 13px; color: var(--muted); white-space: nowrap; }

    /* ── Page: the text column and the rail beside it ── */
    #page {
      display: grid; grid-template-columns: minmax(0, 44rem) minmax(0, 17.5rem);
      justify-content: space-between; gap: 0 48px;
      padding-top: 40px; padding-bottom: 72px;
    }
    #rail { align-self: start; position: sticky; top: calc(var(--top-h) + 40px); max-height: calc(100vh - var(--top-h) - 64px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
    #rail h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .note { color: var(--muted); font-size: 15px; padding: 48px 0; }
    .note p + p { margin-top: 12px; }
    .note button {
      height: 34px; padding: 0 12px; border-radius: 6px; cursor: pointer;
      background: none; border: 1px solid var(--rule); color: var(--text);
    }
    .note button:hover { background: var(--raised); }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .fade { animation: fadein 0.18s ease; }

    #foot {
      display: flex; flex-wrap: wrap; gap: 6px 24px; padding-top: 20px; padding-bottom: 40px;
      font-size: 13px; color: var(--muted);
    }
    #foot::before { content: ''; flex-basis: 100%; border-top: 1px solid var(--rule); margin-bottom: 14px; }
    #foot a:hover { color: var(--text); }
    #foot .keys { margin-left: auto; }
    #foot kbd { font-family: var(--mono); font-size: 12px; padding: 0 4px; border: 1px solid var(--rule); border-radius: 4px; }

    /* ── The on-this-page list (rail) ── */
    .toc-rail ol { list-style: none; font-size: 14px; border-left: 1px solid var(--rule); }
    .toc-rail a {
      display: block; padding: 3px 0 3px 14px; margin-left: -1px; border-left: 1px solid transparent;
      color: var(--muted); text-decoration: none;
    }
    .toc-rail a:hover { color: var(--text); }
    .toc-rail a.here { color: var(--text); border-left-color: var(--text); }
    .toc-rail li.sub a { padding-left: 28px; font-size: 13px; }

    /* ── Overview ── */
    /* The day as a diff header: the day before (a link back) and the day shown. Its signs are
       ink, not green and red: those are the Highlights' own. */
    .hero { margin-bottom: 28px; font-family: var(--mono); letter-spacing: -0.03em; }
    .hero .sign { color: var(--muted); font-weight: 400; margin-right: 0.5ch; }
    .hero-old { display: inline-block; font-size: 16px; color: var(--muted); text-decoration: none; }
    .hero-old:hover { color: var(--text); }
    .hero h1 { font-size: 40px; font-weight: 600; line-height: 1.15; white-space: nowrap; }

    /* One pane for the day's highlights: a header per report (a diff's file header, a link to
       the report), its highlights as that file's lines. */
    .diff { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); overflow: hidden; }
    .file + .file { border-top: 1px solid var(--rule); }
    .file-hdr { font-size: 15px; font-weight: 600; background: var(--raised); }
    .file-hdr a { display: flex; align-items: center; padding: 9px 16px 9px 0; text-decoration: none; }
    .file-hdr a:hover span:last-child { text-decoration: underline; text-underline-offset: 3px; }
    .file-hdr .tile { margin: 0 calc((var(--gutter) - 10px) / 2); }
    .file .none { padding: 9px 16px 9px var(--gutter); font-size: 14px; color: var(--muted); }

    .overview h2.sec { font-size: 18px; font-weight: 600; margin: 40px 0 10px; }
    .stories { list-style: none; }
    .stories li { padding: 9px 0; border-top: 1px solid var(--rule); }
    .stories li:last-child { border-bottom: 1px solid var(--rule); }
    .stories a, .upcoming a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--dim); }
    .stories a:hover, .upcoming a:hover { text-decoration-color: currentColor; }
    .stories .counts { display: block; font-size: 13px; color: var(--muted); }
    .upcoming { list-style: none; font-size: 14px; line-height: 1.45; }
    .upcoming li { display: grid; grid-template-columns: 3.75rem 1fr; gap: 0 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
    .upcoming time, .upcoming .when { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .upcoming .src { display: block; font-size: 13px; color: var(--muted); }

    /* ── Markdown (a report) ── */
    /* A long identifier or URL breaks inside the column rather than widening the page. */
    .md { font-size: 16px; line-height: 1.6; overflow-wrap: break-word; }
    .md h1 { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
    /* A report's H1 carries its square (--tile on .md, set by decorateReport). */
    .md.report > h1:first-child { display: flex; align-items: center; gap: 12px; }
    .md.report > h1:first-child::before {
      content: ''; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px;
      background: var(--tile, var(--muted));
    }
    .md h2 { font-size: 21px; font-weight: 600; line-height: 1.3; margin: 44px 0 12px; letter-spacing: -0.01em; }
    .md h3 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; }
    .md h4 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; color: var(--muted); }
    /* Text keeps a readable measure; tables and the Highlights take the column's full width. */
    .md > p, .md > ul:not(.gutter), .md > ol, .md > blockquote { max-width: 41rem; }
    .md p { margin-bottom: 12px; }
    /* Underlined, faintly: a link in a sentence must not depend on its color alone. */
    .md a {
      color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
      text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
    }
    .md a:hover { text-decoration-color: currentColor; }
    .md strong { font-weight: 600; }
    /* The Markdown's rules sit before headings, whose spacing already separates the sections. */
    .md hr { display: none; }
    .md ul, .md ol { padding-left: 22px; margin-bottom: 12px; }
    .md li { margin-bottom: 6px; }
    .md li > ul, .md li > ol { margin-top: 6px; margin-bottom: 0; }
    .md blockquote { border-left: 2px solid var(--rule); padding: 4px 16px; margin: 12px 0; color: var(--muted); }
    /* A report's meta line, under its H1 (the report bar between them is removed here: the tabs
       are the web UI's bar). decorateReport splits it at its " | " into items. */
    .md blockquote.report-meta {
      max-width: none; border: none; padding: 0 0 20px; margin: 10px 0 0;
      border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .md blockquote.report-meta p { display: flex; flex-wrap: wrap; gap: 2px 20px; margin: 0; }
    .md blockquote.report-meta a { color: inherit; text-decoration-color: currentColor; }
    .md blockquote.report-meta a:hover { color: var(--text); }
    .md code {
      font-family: var(--mono); font-size: 0.875em;
      background: var(--code-bg); padding: 1px 4px; border-radius: 4px;
      overflow-wrap: anywhere;
    }
    .md pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 14px 0; }
    .md pre code { background: none; padding: 0; font-size: 13px; }
    .md .table-wrap { overflow-x: auto; margin: 14px 0; }
    .md table {
      width: 100%; border-collapse: collapse;
      font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--text);
    }
    .md th {
      padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule);
      font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
    }
    /* A number column's header keeps the alignment its Markdown gives it (`---:`). */
    .md th:not([align]) { text-align: left; }
    .md td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
    .md th:last-child, .md td:last-child { padding-right: 0; }
    .md td.date { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .md details { border: 1px solid var(--rule); border-radius: 6px; margin: 10px 0; overflow: hidden; }
    .md summary {
      cursor: pointer; padding: 8px 14px;
      font-size: 14px; color: var(--muted);
      background: var(--surface); user-select: none; list-style: none;
      display: flex; align-items: center; gap: 8px; transition: color 0.12s;
    }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    .md details[open] summary::before { content: '▼'; }
    .md summary:hover { color: var(--text); }
    .md details > *:not(summary) { padding: 12px 14px; }
    /* The contents list inside the page: for the widths without the rail. */
    .md details.toc { display: none; margin: 20px 0 0; }
    .md details.toc > *:not(summary) { padding: 8px 14px 8px 34px; margin: 0; }
    .md details.toc li { margin-bottom: 2px; }
    .md details.toc li.sub { margin-left: 16px; list-style: circle; }
    .md mark, .hit mark { background: var(--found); color: inherit; border-radius: 2px; }

    /* Weekly Diff is an article, not a report of tables: a serif at a narrower measure. Its
       italics are the writer's interpretation (the meta line says so). */
    .md.article { font-family: var(--serif); font-size: 18px; line-height: 1.7; }
    .md.article > p, .md.article > ul, .md.article > ol { max-width: 36rem; }
    .md.article p { margin-bottom: 18px; }
    .md.article h1, .md.article h2, .md.article h3, .md.article blockquote.report-meta { font-family: var(--sans); }
    .md.article h2 { margin-top: 40px; }
    .md.article blockquote.report-meta { margin-bottom: 28px; }

    /* Highlights as a diff hunk: + for what arrived, − for what is going away (gutterList).
       After the .md rules, so these win over its list defaults. A list without signs (a day
       before SIGNED_SINCE) keeps a plain gutter on the overview and its bullets in a report. */
    ul.highlights, ul.gutter { list-style: none; padding: 0; margin: 0; }
    .md ul.gutter { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); overflow: hidden; margin: 0 0 12px; }
    ul.highlights > li, ul.gutter > li {
      position: relative; margin: 0; padding: 9px 16px 9px calc(var(--gutter) + 14px);
    }
    ul.highlights > li + li, ul.gutter > li + li { border-top: 1px solid var(--surface); }
    ul.highlights > li::before, ul.gutter > li::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--gutter);
      padding-top: 9px; text-align: center;
      font-family: var(--mono); font-weight: 600; background: var(--raised);
    }
    /* No signs, so no gutter: plain lines with a rule between them. */
    ul.highlights:not(.gutter) > li { padding-left: 16px; }
    ul.highlights:not(.gutter) > li + li { border-top-color: var(--rule); }
    ul.highlights:not(.gutter) > li::before { content: none; }
    ul.gutter > li { background: var(--added-bg); }
    ul.gutter > li::before { content: '+'; color: var(--added); background: var(--added-gutter); }
    ul.gutter > li.gone { background: var(--removed-bg); }
    ul.gutter > li.gone::before { content: '−'; color: var(--removed); background: var(--removed-gutter); }

    /* ── Dialogs: the archive calendar and search ── */
    dialog {
      margin: calc(var(--bar-h) + 8px) auto 0; padding: 0; border: 1px solid var(--rule); border-radius: 10px;
      background: var(--surface); color: var(--text);
      width: min(calc(100vw - 24px), 640px); max-height: calc(100vh - var(--bar-h) - 32px);
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: var(--backdrop); }
    .dlg-head { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--rule); }
    .dlg-head h2 { font-size: 16px; font-weight: 600; margin-right: auto; }
    .dlg-body { overflow-y: auto; padding: 16px 20px 20px; }
    #calDlg { width: min(calc(100vw - 24px), 360px); }
    .cal-month + .cal-month { margin-top: 20px; }
    .cal-month h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-family: var(--mono); font-size: 13px; text-align: center; }
    .cal-grid .dow { color: var(--muted); font-family: var(--sans); font-size: 12px; padding-bottom: 2px; }
    .cal-day { position: relative; line-height: 36px; border-radius: 6px; text-decoration: none; }
    /* A past day without a digest. A day after the newest digest is an empty cell. */
    .cal-day.off { color: var(--muted); }
    a.cal-day { font-weight: 500; }
    a.cal-day:hover { background: var(--raised); }
    a.cal-day[aria-current] { background: var(--text); color: var(--bg); font-weight: 600; }
    /* A day with the weekly pages: a dot under its number. */
    a.cal-day.weekly::after {
      content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px;
      border-radius: 50%; background: currentColor; opacity: 0.6;
    }
    .cal-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
    .cal-foot a { color: var(--link); text-decoration: none; }
    .cal-foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

    #searchDlg .dlg-head { padding: 10px 12px; }
    #searchInput {
      flex: 1; min-width: 0; height: 38px; padding: 0 10px;
      border: 1px solid var(--rule); border-radius: 6px;
      background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 16px;
    }
    #searchInput:focus-visible { outline-offset: -1px; }
    #searchStatus, #searchProgress { font-size: 13px; color: var(--muted); }
    #searchStatus:not(:empty), #searchProgress:not(:empty) { margin-bottom: 8px; }
    #searchResults { list-style: none; }
    .hit a { display: block; padding: 10px 0; border-top: 1px solid var(--rule); text-decoration: none; }
    .hit a:hover .hit-name { text-decoration: underline; text-underline-offset: 3px; }
    .hit-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .hit-name { font-weight: 600; }
    .hit-head time, .hit-n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .hit-n { margin-left: auto; white-space: nowrap; }
    .hit-line { display: block; margin-top: 3px; font-size: 14px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; }
    .hit-line mark { color: var(--text); }

    /* ── Without the rail: one column, the contents list inside the page ── */
    @media (max-width: 1099px) {
      .wrap { max-width: calc(44rem + 64px); }
      #page { grid-template-columns: minmax(0, 1fr); }
      #rail { position: static; max-height: none; overflow: visible; margin-top: 40px; }
      #rail h2 { font-size: 18px; }
      #rail:empty, .toc-rail { display: none; }
      .md details.toc { display: block; }
      .upcoming { font-size: 15px; }
    }
    /* ── Phone ── */
    @media (max-width: 680px) {
      :root { --gutter: 36px; }
      .wrap { padding: 0 16px; }
      .brand { margin-right: 4px; }
      .brand span, .wide-only, .act-search span, .act-search kbd, #foot .keys { display: none; }
      .act-search { border-color: transparent; padding: 0; }
      #page { padding-top: 24px; padding-bottom: 48px; }
      .tabs-in { gap: 0 20px; }
      .hero { margin-bottom: 20px; }
      .hero-old { font-size: 14px; }
      .hero h1 { font-size: 26px; }
      ul.highlights > li, ul.gutter > li { padding-left: calc(var(--gutter) + 12px); padding-right: 12px; }
      .md { font-size: 15px; }
      .md h1 { font-size: 24px; }
      .md h2 { font-size: 20px; margin-top: 36px; }
      .md.article { font-size: 17px; }
      .md table.stack, .md table.stack tbody { display: block; }
      .md table.stack thead { display: none; }
      .md table.stack tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--rule); }
      /* Inline, so a long title wraps as text. The separator opens with a no-break space and
         decorateReport removes the white space between the cells, so a line can break only
         after the separator: it stays on the line of the cell before it. */
      .md table.stack td { display: inline; padding: 0; border: 0; font-size: 13px; color: var(--muted); }
      .md table.stack td:not(:empty):not(.prose):not(.blank) ~ td:not(:empty):not(.prose):not(.blank)::before { content: '\00a0\00a0·  '; white-space: pre-wrap; }
      .md table.stack td.prose { display: block; margin-top: 4px; font-size: 14px; color: var(--text); }
      .md table.stack td:empty, .md table.stack td.blank { display: none; }
      dialog { margin-top: 8px; max-height: calc(100vh - 16px); }
    }
    /* Most phones: the bar is tighter, and fits from 363 px. Narrower ones (to 320 px) drop the
       newest day's tag. */
    @media (max-width: 420px) {
      .wrap { padding: 0 12px; }
      .bar-in { gap: 4px; }
      .step, .act { min-width: 30px; }
      #dayBtn { padding: 0 6px; }
    }
    @media (max-width: 365px) {
      .run-tag { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <!-- The mark: a diff gutter, + over −. favicon-16.svg is the tab icon, redrawn on a 16 px grid (whole-pixel shapes, square ends) so it stays sharp; favicon.svg is this drawing on a fixed background, the source of the PNG renders (banner.png too). -->

        <path d="M13.5 45.5h15M39.5 45.5h4" stroke="#F0716A"/>

  <div id="top">

            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>

    </header>
    <nav id="tabs" aria-label="Reports of this day">
      <div id="tabList" class="wrap tabs-in"></div>

  </div>

  <main id="page" class="wrap">
    <div id="content"><p class="note">Loading…</p></div>
    <aside id="rail"></aside>
  </main>

  <footer id="foot" class="wrap">
    <a href="./feed.xml">RSS feed</a>
    <a href="https://github.com/dboeter/daily-diff" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
    <span class="keys"><kbd>←</kbd> <kbd>→</kbd> change the day, <kbd>/</kbd> search</span>
  </footer>

  <dialog id="calDlg" aria-labelledby="calTitle">
    <div class="dlg-head">
      <h2 id="calTitle">Archive</h2>
      <button class="act" type="button" data-close aria-label="Close the archive">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>

  </dialog>

  <dialog id="searchDlg" aria-label="Search all reports">
    <div class="dlg-head">
      <input id="searchInput" type="search" placeholder="Search all reports, e.g. Claude" aria-label="Search all reports" autocomplete="off">
      <button class="act" type="button" data-close aria-label="Close search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <!-- The reading progress changes once per report, so it is not announced; the outcome is. -->
      <div id="searchProgress"></div>
      <div id="searchStatus" role="status"></div>
      <ol id="searchResults"></ol>
    </div>
  </dialog>

  <noscript><p class="wrap note">Daily Diff loads its reports with JavaScript. Without it, read them as <a href="https://github.com/dboeter/daily-diff/tree/main/digests">Markdown files on GitHub</a>.</p></noscript>

<script>
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

// Report id → label, from manifest.json (`labels`, written from REPORT_LABELS in src/core/strings.ts).
let LABELS = {};

// ── Theme ──
// The head script already set the theme: the stored choice, else the system's. Only a click
// on the button stores one, so a reader who never clicks keeps following the system.
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let theme = htmlEl.dataset.theme === 'light' ? 'light' : 'dark';

function applyTheme(t, store) {
  theme = t;
  htmlEl.dataset.theme = t;
  const label = `Switch to ${t === 'dark' ? 'light' : 'dark'} theme`;
  themeBtn.title = label;
  themeBtn.setAttribute('aria-label', label);
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0E1110' : '#F5F7F5';
  if (!store) return;
  try { localStorage.setItem('dd-theme', t); } catch { /* storage blocked: the choice lasts for this visit */ }
}
applyTheme(theme, false);
// One flag for the reader's own choice: a click now, or one stored on an earlier visit.
let themeChosen = false;
try {
  themeChosen = localStorage.getItem('dd-theme') !== null || localStorage.getItem('ar-theme') === 'light';
} catch { /* storage blocked: no stored choice */ }
themeBtn.onclick = () => {
  themeChosen = true;
  applyTheme(theme === 'dark' ? 'light' : 'dark', true);
};
// Without a choice, an open page follows the system when it changes (sunset, a settings switch).
matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
  if (!themeChosen) applyTheme(e.matches ? 'light' : 'dark', false);
});

// ── Routing ──
// #YYYY-MM-DD/report is a report, #YYYY-MM-DD the day's overview. Every published report bar,
// issue and feed links these, so nothing else may use the hash: a heading is scrolled to.
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) ? { date, report: report || null } : null;
}

const pageKey = (date, report) => (report ? `${date}/${report}` : date);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Manifest data: dates newest first, the weekly report ids, the overview's
// label (OVERVIEW in src/core/strings.ts), its Coming up heading (COMING_UP) and the
// Highlights heading (SECTIONS).
let DATES = [];
let WEEKLY = [];
let COLORS = {};
let FEEDS = {};
let OVERVIEW_LABEL = 'Overview';
let COMING_UP_HEADING = 'Coming up';
let TALKED_ABOUT_HEADING = 'Also talked about';
let POLICY_TALK_HEADING = 'Policy talk';
let HIGHLIGHTS_HEADING = 'Highlights';
let PROSE_COLUMNS = ['Summary', 'What to do'];

const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/** "21 Oct", with the year only when it is not the page's own; the ISO date stays in datetime and title. */
function timeHtml(iso, pageDate) {
  const [y, m, d] = iso.split('-');
  const label = `${Number(d)} ${MONTHS[Number(m) - 1]}${y === pageDate.slice(0, 4) ? '' : ` ${y}`}`;
  return `<time datetime="${iso}" title="${iso}">${label}</time>`;
}

/** "Tue 17 Nov", with the year on request. A digest date is a calendar day, so it is read as UTC. */
function dayLabel(iso, withYear) {
  const [y, m, d] = iso.split('-').map(Number);
  const weekday = WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return `${weekday} ${d} ${MONTHS[m - 1]}${withYear ? ` ${y}` : ''}`;
}

// ── State ──
let currentKey = null;
let searchIndex = null;
let searchReady = false;
let searchQuery = '';
let searchDebounce = null;
// The search words to find on the page a result opens.
let pendingFind = null;

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

// ── Dialogs ──
const calDlg = document.getElementById('calDlg');
const searchDlg = document.getElementById('searchDlg');
for (const dlg of [calDlg, searchDlg]) {
  // A click on the backdrop lands on the dialog itself; one on a link inside means the reader chose.
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('[data-close], a[href]')) dlg.close();
  });
}
document.getElementById('dayBtn').onclick = () => {
  calDlg.showModal();
  // The day shown, in the middle of the list. Not scrollIntoView: it scrolls the page behind too.
  const body = document.getElementById('calBody');
  const day = calDlg.querySelector('[aria-current]');
  if (!day) return;
  body.scrollTop += day.getBoundingClientRect().top - body.getBoundingClientRect().top - body.clientHeight / 2;
  // Tab and the arrow keys start from the day shown, not from the first day of the newest month.
  day.focus({ preventScroll: true });
};

// ── Search ──
const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');
const searchProgress = document.getElementById('searchProgress');
const searchResults = document.getElementById('searchResults');
// Results are one per report, newest first; more than this many and the reader should narrow the search.
const MAX_HITS = 40;

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

/**
 * A report's Markdown as plain lines to search and to quote: without its header (H1, report
 * bar, meta line), link targets and markup, so "github" finds the word and not every link.
 * A line is what the page shows as one block, so a match can be marked there (findOnPage): a
 * table row is one line per cell, and a table's header row, which a phone hides, is left out.
 */
function searchLines(md) {
  const lines = md.split('\n');
  const rule = lines.slice(0, 8).indexOf('---');
  const body = lines.slice(rule === -1 ? 1 : rule + 1);
  const isRow = (line) => /^\s*\|/.test(line);
  const isHeaderRule = (line) => isRow(line) && /^[\s|:-]+$/.test(line) && line.includes('-');
  const out = [];
  body.forEach((raw, i) => {
    if (isRow(raw) && (isHeaderRule(raw) || isHeaderRule(body[i + 1] ?? ''))) return;
    for (const part of isRow(raw) ? raw.split('|') : [raw]) {
      const text = part
        .replace(/<[^>]+>/g, '')
        .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/^\s*(#{1,6}|[-*>]|\d+\.)\s+/, '')
        .replace(/\*\*|`/g, '')
        .trim();
      if (!text || /^[\s:—-]+$/.test(text)) continue;
      out.push({ text, lower: text.toLowerCase() });
    }
  });
  return out;
}

/** The words around a match, the match marked. Report text reaches this HTML through escapeHtml only. */
function snippetHtml(text, at, length) {
  const start = Math.max(0, at - 60);
  const end = Math.min(text.length, at + length + 110);
  return `${start > 0 ? '…' : ''}${escapeHtml(text.slice(start, at))}<mark>${escapeHtml(text.slice(at, at + length))}</mark>${escapeHtml(text.slice(at + length, end))}${end < text.length ? '…' : ''}`;
}

function applySearch(query) {
  const needle = query.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (!needle || !searchReady) {
    // Before the first reading ends, the progress line shows; the query is applied when it does.
    setSearchStatus('');
    return;
  }
  const hits = [];
  let days = new Set();
  for (const { date, reports } of DATES) {
    for (const report of reports) {
      const lines = searchIndex.get(pageKey(date, report));
      if (!lines) continue;
      const matched = lines.filter((l) => l.lower.includes(needle));
      if (!matched.length) continue;
      days.add(date);
      hits.push({ date, report, count: matched.length, line: matched[0] });
    }
  }
  // The announced outcome names the reports that did not load too: the line above it is not announced.
  const missing = unread?.length ? ` (${unread.length} report${unread.length === 1 ? '' : 's'} not searched)` : '';
  if (!hits.length) {
    setSearchStatus(`No report has “${query.trim()}”${missing}. Try a shorter word or another spelling.`);
    return;
  }
  const reportsText = `${hits.length} report${hits.length === 1 ? '' : 's'} on ${days.size} day${days.size === 1 ? '' : 's'}`;
  setSearchStatus(`${reportsText}${hits.length > MAX_HITS ? `; the newest ${MAX_HITS} are listed` : ''}${missing}`);
  searchResults.innerHTML = hits.slice(0, MAX_HITS).map(({ date, report, count, line }) =>
    `<li class="hit"><a href="#${pageKey(date, report)}">` +
      `<span class="hit-head">${tileHtml(report)}<span class="hit-name">${escapeHtml(LABELS[report] || report)}</span>` +
      `<time datetime="${date}">${dayLabel(date, true)}</time>` +
      `<span class="hit-n">${count} match${count === 1 ? '' : 'es'}</span></span>` +
      `<span class="hit-line">${snippetHtml(line.text, line.lower.indexOf(needle), needle.length)}</span>` +
    '</a></li>',
  ).join('');
}

/** Reads the reports of `tasks` into the index; returns the ones whose fetch failed. */
async function readReports(tasks, index) {
  // Drain one task list with a small worker pool so we never flood the
  // browser's connection pool (a fetch storm here was starving the primary
  // content fetch and causing "Failed to fetch" on initial load).
  const failed = [];
  let cursor = 0;
  let read = 0;
  const worker = async () => {
    while (cursor < tasks.length) {
      const task = tasks[cursor++];
      try {
        const res = await fetch(`./digests/${task.date}/${task.report}.md`);
        // Whatever the status, a report not read is counted and tried again: a 404 can be a
        // deploy in progress, and a reader must know the search is not the whole archive.
        if (res.ok) index.set(pageKey(task.date, task.report), searchLines(await res.text()));
        else failed.push(task);
      } catch {
        failed.push(task);
      }
      read += 1;
      searchProgress.textContent = `Reading the reports: ${read} of ${tasks.length}`;
    }
  };
  const POOL = 6;
  await Promise.all(Array.from({ length: POOL }, worker));
  return failed;
}

let allDates = null;
let searchReading = false;
// The reports still to read: all of them at first, then the ones whose fetch failed, which the
// next opening of search reads again.
let unread = null;

function ensureSearchIndex() {
  if (searchReading || !allDates) return;
  if (!unread) {
    unread = [];
    allDates.forEach(({ date, reports }) => reports.forEach((report) => unread.push({ date, report })));
    searchIndex = new Map();
  }
  if (!unread.length) return;
  searchReading = true;
  searchProgress.textContent = 'Reading the reports…';
  readReports(unread, searchIndex).then((failed) => {
    unread = failed;
    searchReading = false;
    searchReady = true;
    // Stays while reports are missing, so "no report has it" is not read as the whole archive.
    searchProgress.textContent = failed.length
      ? `${failed.length} report${failed.length === 1 ? '' : 's'} did not load and ${failed.length === 1 ? 'is' : 'are'} not searched. Close and open search to read ${failed.length === 1 ? 'it' : 'them'} again.`
      : '';
    applySearch(searchQuery);
  });
}

function openSearch() {
  if (searchDlg.open) return;
  if (calDlg.open) calDlg.close();
  searchDlg.showModal();
  searchInput.select();
  ensureSearchIndex();
}
document.getElementById('searchBtn').onclick = openSearch;

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => applySearch(searchQuery), 120);
});
// Esc closes search (left to the browser, the first Esc only empties a search field); Enter
// opens the first result.
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    searchDlg.close();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // Typed and pressed Enter within the debounce: apply the query first.
    clearTimeout(searchDebounce);
    applySearch(searchQuery);
    searchResults.querySelector('a[href]')?.click();
  }
});
// A result opens its report at the first match. The click also closes the dialog (above).
searchResults.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  pendingFind = searchQuery.trim().toLowerCase();
  // The page already shown fires no hashchange: find the match in it now.
  if (a.getAttribute('href') === `#${currentKey}`) findOnPage();
});

/**
 * Marks the first match of the search a result came from, and scrolls to it. The search index is
 * the Markdown without its markup, so a match may run through a link, bold or code on the page:
 * it is looked for in each block's whole text, and marked in every text node it runs through.
 * A date the page shows as "16 Nov" is found by its ISO form in the <time> element.
 */
function findOnPage() {
  const needle = pendingFind;
  pendingFind = null;
  const root = document.querySelector('#content .md');
  if (!needle || !root) return;
  root.querySelectorAll('mark.found').forEach((m) => m.replaceWith(...m.childNodes));
  root.normalize();
  const show = (el) => {
    for (let d = el.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
    el.scrollIntoView({ block: 'center' });
  };
  const wrap = (node, from, to) => {
    const range = document.createRange();
    range.setStart(node, from);
    range.setEnd(node, to);
    const mark = document.createElement('mark');
    mark.className = 'found';
    range.surroundContents(mark);
    return mark;
  };
  for (const block of root.querySelectorAll('h1, h2, h3, h4, p, li, td, summary, pre')) {
    if (block.closest('.toc, .report-meta')) continue;
    // Not shown at this width (a stacked table's empty cell), unless a collapsed block holds it.
    if (!block.getClientRects().length && !block.closest('details:not([open])')) continue;
    const at = block.textContent.toLowerCase().indexOf(needle);
    if (at === -1) continue;
    // The text nodes the match runs through, each with the part of it that is the match.
    const parts = [];
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    let pos = 0;
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const from = Math.max(at, pos);
      const to = Math.min(at + needle.length, pos + node.length);
      if (from < to) parts.push([node, from - pos, to - pos]);
      pos += node.length;
    }
    const marks = parts.map(([node, from, to]) => wrap(node, from, to));
    if (marks.length) show(marks[0]);
    return;
  }
  const time = [...root.querySelectorAll('time[datetime]')].find((t) => t.getAttribute('datetime').includes(needle));
  if (time?.firstChild?.nodeType === Node.TEXT_NODE) show(wrap(time.firstChild, 0, time.firstChild.length));
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

async function fetchReport(date, report) {
  let res;
  // Retry transient failures: network errors and statuses that may recover
  // on their own (5xx, 429). A 4xx like 404 means the report is really
  // missing (manifest/digests drift) — fail immediately instead of
  // stalling the error behind three retries and backoff.
  for (let attempt = 0; ; attempt++) {
    try {
      res = await fetch(`./digests/${date}/${report}.md`);
      if (res.ok || (res.status < 500 && res.status !== 429) || attempt >= 2) break;
    } catch (netErr) {
      if (attempt >= 2) throw netErr;
    }
    await new Promise((r) => setTimeout(r, 300 * (attempt + 1)));
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

/** A report's square; a retired report has no color in the manifest and gets the neutral one. */
function tileHtml(id) {
  const color = COLORS[id];
  return color ? `<span class="tile" style="--tile:${escapeHtml(color)}"></span>` : '<span class="tile"></span>';
}

/**
 * The latest report of each weekly kind, pinned at the end of the tabs until the
 * next weekly run replaces it. Counted from today, not from the newest day in
 * the manifest, so a report stops passing for this week's when runs stop too.
 * 8 days, not 7: a date parses as 00:00 UTC, and the next Monday's run (01:07
 * Amsterdam, started hours late) lands a few hours into the 8th day.
 */
function latestWeekly() {
  const now = Date.now();
  return WEEKLY
    .map((id) => ({ id, entry: DATES.find((d) => d.reports.includes(id)) }))
    .filter((x) => x.entry && now - Date.parse(x.entry.date) < 8 * 86400000);
}

/** The previous and next day, and the day of this report's previous edition (weekly reports skip days). */
function neighbours(date, report) {
  const i = DATES.findIndex((d) => d.date === date);
  if (i === -1) return {};
  const older = DATES[i + 1];
  const newer = DATES[i - 1];
  // The same report on that day when it has one, else that day's overview.
  const href = (d) => `#${pageKey(d.date, report && d.reports.includes(report) ? report : null)}`;
  const prevReportDay = report ? DATES.slice(i + 1).find((d) => d.reports.includes(report)) : null;
  return {
    index: i,
    older: older && { date: older.date, href: href(older) },
    newer: newer && { date: newer.date, href: href(newer) },
    prevReport: prevReportDay && prevReportDay !== older ? prevReportDay.date : null,
  };
}

/** Marks the tab row's edges that have more tabs beyond them, for the fade there. */
function fadeTabs() {
  const tabList = document.getElementById('tabList');
  tabList.classList.toggle('more-left', tabList.scrollLeft > 4);
  tabList.classList.toggle('more-right', tabList.scrollWidth - tabList.clientWidth - tabList.scrollLeft > 4);
}
/** Brings the current tab into the row. Only the row scrolls, sideways: scrollIntoView would move the page too. */
function showCurrentTab() {
  const tabList = document.getElementById('tabList');
  const current = tabList.querySelector('[aria-current]');
  if (current) tabList.scrollLeft += current.getBoundingClientRect().left - tabList.getBoundingClientRect().left - 32;
  fadeTabs();
}
document.getElementById('tabList').addEventListener('scroll', fadeTabs, { passive: true });
// A new width can leave the current tab outside the row. A new height alone (a phone's address
// bar) must not move a row the reader scrolled.
let tabsWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === tabsWidth) return fadeTabs();
  tabsWidth = window.innerWidth;
  showCurrentTab();
});
// The tabs are narrower once IBM Plex replaces the fallback font, so the first position is off.
document.fonts.ready.then(showCurrentTab);

/** The bar's day, its arrows, the day's tabs and the calendar's selected day, for the page shown. */
function syncShell(date, report) {
  const { index, older, newer } = neighbours(date, report);
  const step = (id, to, name, key) => {
    const a = document.getElementById(id);
    const label = to ? `${name} day, ${dayLabel(to.date, true)} (${key})` : `No ${name.toLowerCase()} day`;
    if (to) a.setAttribute('href', to.href); else a.removeAttribute('href');
    a.setAttribute('aria-disabled', String(!to));
    a.title = label;
    a.setAttribute('aria-label', label);
  };
  step('prevDay', older, 'Previous', '←');
  step('nextDay', newer, 'Next', '→');
  document.getElementById('dayLabel').textContent = ISO_DATE.test(date) ? dayLabel(date, false) : date;
  // The newest run is "today" on the viewer's own date ('sv' formats as YYYY-MM-DD), else "latest".
  const tag = document.getElementById('runTag');
  tag.hidden = index !== 0;
  tag.textContent = date === new Date().toLocaleDateString('sv') ? 'today' : 'latest';

  const entry = DATES[index];
  const tab = (d, id, when) =>
    `<a class="tab" href="#${pageKey(d, id)}"${COLORS[id] ? ` style="--tile:${escapeHtml(COLORS[id])}"` : ''}` +
    `${d === date && id === report ? ' aria-current="page"' : ''}>` +
    `${id ? tileHtml(id) : ''}${escapeHtml(id ? LABELS[id] || id : OVERVIEW_LABEL)}${when ? timeHtml(d, date) : ''}</a>`;
  const own = entry ? [tab(date, null), ...entry.reports.map((id) => tab(date, id))] : [];
  const pinned = latestWeekly().filter((x) => x.entry.date !== date).map((x) => tab(x.entry.date, x.id, true));
  const tabList = document.getElementById('tabList');
  tabList.innerHTML = own.join('') + (pinned.length ? `<div class="tabs-pin"><span>This week</span>${pinned.join('')}</div>` : '');
  showCurrentTab();

  calDlg.querySelectorAll('a.cal-day').forEach((a) => {
    if (a.dataset.date === date) a.setAttribute('aria-current', 'date'); else a.removeAttribute('aria-current');
  });
  const name = report ? LABELS[report] || report : OVERVIEW_LABEL;
  document.title = ISO_DATE.test(date) ? `${name}, ${dayLabel(date, true)} | Daily Diff` : 'Daily Diff';
}

/** The archive: a month grid per month with a digest, newest first; a day with a digest links its overview. */
function buildCalendar(dates) {
  const byDate = new Map(dates.map((d) => [d.date, d]));
  const months = [...new Set(dates.map((d) => d.date.slice(0, 7)))];
  const heads = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => `<span class="dow">${d}</span>`).join('');
  // A day without a digest is a missed day between the first digest and the reader's today
  // ('sv' formats as YYYY-MM-DD); before and after those it is an empty cell.
  const today = new Date().toLocaleDateString('sv');
  const lastDay = today > dates[0].date ? today : dates[0].date;
  const html = months.map((month) => {
    const [y, m] = month.split('-').map(Number);
    const blanks = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const cells = Array.from({ length: blanks }, () => '<span></span>');
    for (let d = 1; d <= days; d++) {
      const iso = `${month}-${String(d).padStart(2, '0')}`;
      const entry = byDate.get(iso);
      if (!entry) {
        cells.push(iso > lastDay || iso < dates.at(-1).date ? '<span></span>' : `<span class="cal-day off">${d}</span>`);
        continue;
      }
      const weekly = entry.reports.some((r) => WEEKLY.includes(r));
      const title = `${dayLabel(iso, true)}: ${entry.reports.length} report${entry.reports.length === 1 ? '' : 's'}${weekly ? ', with the weekly pages' : ''}`;
      cells.push(`<a class="cal-day${weekly ? ' weekly' : ''}" href="#${iso}" data-date="${iso}" title="${escapeHtml(title)}">${d}</a>`);
    }
    return `<section class="cal-month"><h3>${MONTH_NAMES[m - 1]} ${y}</h3><div class="cal-grid">${heads}${cells.join('')}</div></section>`;
  });
  document.getElementById('calBody').innerHTML =
    `${html.join('')}<p class="cal-foot">A dot marks a day with the weekly pages. <a href="#${dates[0].date}">Go to the latest day</a></p>`;
}

/**
 * The day's page: its highlights (highlights.json, also sent to Telegram) in one diff pane, each
 * report's under a link to it, then Policy talk and Also talked about (talked-about.json, split
 * by `topic`). Coming up (coming-up.json) goes beside them, in the rail.
 */
async function renderOverview(date) {
  const entry = DATES.find((d) => d.date === date);
  if (!entry) throw new Error('unknown date');
  // The day's three files at once. A missing or unreadable one is null: older days have no
  // highlights.json (the overview is then a list of links), talked-about.json or coming-up.json.
  const dayFile = async (name) => {
    try {
      const res = await fetch(`./digests/${date}/${name}`);
      return res.ok ? await res.json() : null;
    } catch {
      return null;
    }
  };
  const [highlights, talkedFile, comingUp] = await Promise.all(
    ['highlights.json', 'talked-about.json', 'coming-up.json'].map(dayFile),
  );
  const { older } = neighbours(date, null);
  const parts = [
    '<header class="hero">' +
      (older ? `<a class="hero-old" href="${older.href}" aria-label="Previous day, ${dayLabel(older.date, true)}"><span class="sign" aria-hidden="true">---</span>${dayLabel(older.date, older.date.slice(0, 4) !== date.slice(0, 4))}</a>` : '') +
      `<h1><span class="sign" aria-hidden="true">+++</span>${dayLabel(date, true)}</h1>` +
    '</header>',
  ];
  const files = entry.reports.map((id) => {
    const items = highlights && Array.isArray(highlights[id]) ? highlights[id] : [];
    const lines = items.length
      ? `<ul class="highlights">${items.map((h) => `<li>${escapeHtml(h)}</li>`).join('')}</ul>`
      : highlights ? '<p class="none">No highlights picked.</p>' : '';
    return `<section class="file"><h2 class="file-hdr"><a href="#${pageKey(date, id)}">${tileHtml(id)}<span>${escapeHtml(LABELS[id] || id)}</span></a></h2>${lines}</section>`;
  });
  parts.push(`<div class="diff">${files.join('')}</div>`);
  const talked = Array.isArray(talkedFile) ? talkedFile : [];
  // Story links reach this HTML without DOMPurify: only http(s) becomes a link.
  const link = (url, text) => /^https?:\/\//i.test(url) ? `<a href="${escapeHtml(url)}">${escapeHtml(text)}</a>` : escapeHtml(text);
  // Policy stories have their own list; every row carries `topic`, so older days split the same way.
  for (const [heading, rows] of [
    [POLICY_TALK_HEADING, talked.filter((t) => t.topic === 'policy')],
    [TALKED_ABOUT_HEADING, talked.filter((t) => t.topic !== 'policy')],
  ]) {
    if (!rows.length) continue;
    parts.push(`<h2 class="sec">${escapeHtml(heading)}</h2>`);
    parts.push(`<ul class="stories">${rows.map((t) =>
      `<li>${link(t.url, t.title)} <span class="counts">${link(t.discussionUrl, t.counts ?? `${t.points} points, ${t.comments} comments`)}</span></li>`,
    ).join('')}</ul>`);
  }
  let rail = '';
  if (Array.isArray(comingUp) && comingUp.length) {
    // Feed links reach this HTML without DOMPurify: only http(s) becomes a link.
    const linked = (c) => /^https?:\/\//i.test(c.link)
      ? `<a href="${escapeHtml(c.link)}">${escapeHtml(c.title)}</a>`
      : escapeHtml(c.title);
    rail = `<h2>${escapeHtml(COMING_UP_HEADING)}</h2><ol class="upcoming">${comingUp.map((c) =>
      `<li>${typeof c.date === 'string' && ISO_DATE.test(c.date) ? timeHtml(c.date, date) : `<span class="when">${escapeHtml(c.date)}</span>`}` +
      `<span>${linked(c)}<span class="src">${escapeHtml(LABELS[c.page] || c.page)}</span></span></li>`,
    ).join('')}</ol>`;
  }
  return { html: parts.join(''), rail };
}

// Weekly Diff: the one report that is an article (REPORTS in src/core/strings.ts), set as one.
const ARTICLE_REPORT = 'ai-weekly';

// Highlights carry the gutter sign (GOING_AWAY in src/core/strings.ts) from this date on: it opens
// one going away, the rest are additions. Earlier days have no signs, so no gutter.
const SIGNED_SINCE = '2026-10-24';
const GOING_AWAY = '−';

/** A Highlights list as a diff hunk; the sign moves from the text to the gutter. */
function gutterList(ul) {
  ul.classList.add('gutter');
  for (const li of ul.children) {
    // A loose list (blank lines between items) wraps each item's text in a <p>.
    const first = li.firstElementChild?.tagName === 'P' ? li.firstElementChild.firstChild : li.firstChild;
    if (first?.nodeType === Node.TEXT_NODE && first.textContent.startsWith(`${GOING_AWAY} `)) {
      first.textContent = first.textContent.slice(GOING_AWAY.length + 1);
      li.classList.add('gone');
    }
  }
}

/** The report bar line: links (the current report in bold) joined by " · " (renderReportBar). */
function isReportBar(p) {
  return p.querySelectorAll('a').length >= 2 && [...p.childNodes].every((n) =>
    n.nodeType === Node.TEXT_NODE ? /^[\s·]*$/.test(n.textContent) : n.tagName === 'A' || n.tagName === 'STRONG');
}

/** The meta line's parts (it joins them with " | ") as items, so they wrap as whole parts. */
function splitMeta(meta) {
  const p = meta.children.length === 1 && meta.firstElementChild.tagName === 'P' ? meta.firstElementChild : null;
  if (!p || !p.textContent.includes(' | ')) return null;
  const items = [document.createElement('span')];
  for (const node of [...p.childNodes]) {
    if (node.nodeType !== Node.TEXT_NODE) {
      items.at(-1).append(node);
      continue;
    }
    node.textContent.split(' | ').forEach((part, k) => {
      if (k > 0) items.push(document.createElement('span'));
      if (part) items.at(-1).append(part);
    });
  }
  p.replaceChildren(...items.filter((item) => item.textContent.trim()));
  return p;
}

/**
 * A report's header and tables for the web UI. Its square goes on the H1, which loses the date
 * (the bar shows the day). The report bar is removed: it stays one Markdown line for GitHub
 * Issues, and the tabs are its form here. The meta line under it gets the report's feed and,
 * for a report that skips days, its previous edition.
 */
function decorateReport(root, date, report) {
  root.classList.add('report');
  if (report === ARTICLE_REPORT) root.classList.add('article');
  if (date >= SIGNED_SINCE) {
    const highlights = [...root.querySelectorAll(':scope > h2')].find((h) => h.textContent.trim() === HIGHLIGHTS_HEADING);
    const list = highlights?.nextElementSibling;
    if (list?.tagName === 'UL') gutterList(list);
  }
  if (COLORS[report]) root.style.setProperty('--tile', COLORS[report]);
  for (const td of root.querySelectorAll('td')) {
    const iso = td.textContent.trim();
    if (!ISO_DATE.test(iso)) continue;
    td.classList.add('date');
    // Only a bare date: one the model linked or emphasized keeps its markup.
    if (!td.children.length) td.innerHTML = timeHtml(iso, date);
  }
  // On a phone a row of 3+ columns stacks: its cells on one line, a prose column (Summary,
  // What to do) under them at full width. Columns no longer align, so the header is hidden.
  // On a wider screen a table too wide for the column scrolls inside its wrapper.
  for (const table of root.querySelectorAll('table')) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    table.replaceWith(wrap);
    wrap.appendChild(table);
    const headers = [...table.querySelectorAll('thead th')].map((th) => th.textContent.trim());
    // Two columns stack too when one is prose (Paper, Summary): side by side it gets half a phone.
    if (headers.length < 3 && !headers.some((h) => PROSE_COLUMNS.includes(h))) continue;
    table.classList.add('stack');
    // A cell that holds only the "nothing" dash says nothing once the columns are gone.
    for (const td of table.querySelectorAll('tbody td')) {
      if (td.textContent.trim() === '—') td.classList.add('blank');
    }
    // The white space the Markdown renderer leaves between cells would let a stacked row break
    // before a separator (the stacked rule in the stylesheet).
    for (const tr of table.querySelectorAll('tbody tr')) {
      for (const node of [...tr.childNodes]) {
        if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) node.remove();
      }
    }
    headers.forEach((h, i) => {
      if (!PROSE_COLUMNS.includes(h)) return;
      for (const td of table.querySelectorAll(`tbody td:nth-child(${i + 1})`)) td.classList.add('prose');
    });
  }
  const h1 = root.querySelector(':scope > h1:first-child');
  if (!h1) return;
  const last = h1.lastChild;
  if (last?.nodeType === Node.TEXT_NODE && last.textContent.trimEnd().endsWith(date)) {
    last.textContent = last.textContent.trimEnd().slice(0, -date.length).trimEnd();
  }
  let next = h1.nextElementSibling;
  if (next?.tagName === 'P' && isReportBar(next)) {
    const bar = next;
    next = bar.nextElementSibling;
    bar.remove();
  }
  if (next?.tagName !== 'BLOCKQUOTE') return;
  next.classList.add('report-meta');
  const items = splitMeta(next);
  if (!items) return;
  const { prevReport } = neighbours(date, report);
  const extra = (href, text) => {
    const item = document.createElement('span');
    const a = document.createElement('a');
    a.href = href;
    a.textContent = text;
    item.appendChild(a);
    items.appendChild(item);
  };
  if (prevReport) extra(`#${pageKey(prevReport, report)}`, `Previous ${LABELS[report] || report}: ${dayLabel(prevReport, prevReport.slice(0, 4) !== date.slice(0, 4))}`);
  if (FEEDS[report]) extra(`./${FEEDS[report]}`, 'RSS feed of this report');
}

// The rail's list of sections marks the one being read.
let tocSpy = null;

/**
 * The contents of a long report: its `##` sections and the `###` under them (a repo section's
 * projects are what a reader looks for), when there are 4 or more. A heading inside a collapsed
 * block is not a section of the page and is left out. Twice: a list in the rail and, for the
 * widths without the rail, a collapsible one before the first section.
 */
function addToc(root) {
  const all = [...root.querySelectorAll('h2, h3')].filter((h) => !h.closest('details'));
  if (all.length < 4) return;
  // The hash holds the route, so scroll instead of linking to an anchor. The focus goes with
  // the reader: Tab then continues in the section, not in the list.
  const entry = (h) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = h.textContent;
    a.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      focusHeading(h);
    };
    const li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'sub';
    li.appendChild(a);
    return { li, a };
  };

  const toc = document.createElement('details');
  toc.className = 'toc';
  const summary = document.createElement('summary');
  summary.textContent = `Contents (${all.length})`;
  const list = document.createElement('ol');
  all.forEach((h) => list.appendChild(entry(h).li));
  toc.append(summary, list);
  all[0].before(toc);

  const nav = document.createElement('nav');
  nav.className = 'toc-rail';
  nav.setAttribute('aria-label', 'On this page');
  const title = document.createElement('h2');
  title.textContent = 'On this page';
  const railList = document.createElement('ol');
  const links = new Map();
  all.forEach((h) => {
    const { li, a } = entry(h);
    links.set(h, a);
    railList.appendChild(li);
  });
  nav.append(title, railList);
  document.getElementById('rail').replaceChildren(nav);

  // The section being read: the last heading above a line a little under the sticky top. At
  // the page's end it is the last one, which may never scroll up to that line.
  const spy = () => {
    let here = all[0];
    for (const h of all) {
      if (h.getBoundingClientRect().top > 160) break;
      here = h;
    }
    if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) here = all.at(-1);
    links.forEach((a, h) => a.classList.toggle('here', h === here));
  };
  tocSpy = spy;
  spy();
}
window.addEventListener('scroll', () => tocSpy?.(), { passive: true });

let loadCount = 0;

/** Moves the keyboard focus to a heading without scrolling, so Tab goes on from there. */
function focusHeading(h) {
  if (!h) return;
  h.tabIndex = -1;
  h.focus({ preventScroll: true });
}
// The heading is at the top of the page: go there, so the focus is not on something out of view.
document.getElementById('skipBtn').onclick = () => {
  window.scrollTo(0, 0);
  focusHeading(document.querySelector('#content h1'));
};

async function loadReport(date, report, push = true) {
  const key = pageKey(date, report);
  if (key === currentKey) return;
  currentKey = key;

  // Retry of the same report (e.g. after a failed load) already has this
  // hash in session history — pushing again would need a second back-press.
  if (push && location.hash !== `#${key}`) history.pushState(null, '', `#${key}`);

  // This load's number. A reply is used only while it is the newest load: the key alone cannot
  // tell two loads of one page apart (open A, open B, open A again while the first A is slow).
  const load = ++loadCount;
  // After the first page, the focus follows the reader to the new page's heading.
  const moveFocus = load > 1;
  syncShell(date, report);
  window.scrollTo(0, 0);
  // The page before stays until this one arrives; a slow one gets a notice instead.
  const slow = setTimeout(() => {
    if (load === loadCount) setContent('<p class="note">Loading…</p>');
  }, 300);

  try {
    const page = report
      ? { html: renderMarkdown(await fetchReport(date, report)), rail: '' }
      : await renderOverview(date);
    clearTimeout(slow);
    // Drop the response if the user has navigated to another page while
    // this fetch was in flight, so a slow stale reply can't overwrite it.
    if (load !== loadCount) return;
    tocSpy = null;
    setContent(`<div class="${report ? 'md' : 'overview'} fade">${page.html}</div>`);
    document.getElementById('rail').innerHTML = page.rail;
    if (report) {
      const md = document.querySelector('#content .md');
      decorateReport(md, date, report);
      addToc(md);
    } else if (date >= SIGNED_SINCE) {
      document.querySelectorAll('#content ul.highlights').forEach(gutterList);
    }
    if (moveFocus) focusHeading(document.querySelector('#content h1'));
    if (report) findOnPage();
    pendingFind = null;
  } catch (e) {
    clearTimeout(slow);
    // The user has already switched to another report — don't overwrite its
    // content with this stale request's error.
    if (load !== loadCount) return;
    // Reset the guard so clicking the same report again retries; otherwise
    // the early-return above turns every further click into a silent no-op
    // and the only way out is loading a different report first.
    currentKey = null;
    tocSpy = null;
    pendingFind = null;
    document.getElementById('rail').innerHTML = '';
    setContent(
      `<div class="note"><p>This page did not load (${escapeHtml(e.message)}).</p>` +
      '<p><button type="button" id="retryBtn">Try again</button></p>' +
      '<p>Or pick another day: the date in the bar opens the archive.</p></div>',
    );
    document.getElementById('retryBtn').onclick = () => loadReport(date, report);
  }
}

// Back/forward, and every link to a page (tabs, day arrows, calendar, search, report bar):
// a same-page hash link fires hashchange. loadReport ignores the repeat.
const followHash = () => {
  const hash = getHash();
  if (!hash) {
    // No route, so no page change: the address goes back to the page shown.
    if (currentKey) history.replaceState(null, '', `#${currentKey}`);
    return;
  }
  const page = knownPage(hash);
  if (page) loadReport(page.date, page.report, false);
};

/**
 * The page a hash names, when the manifest has it. A day it has without that report gives the
 * day's overview, and a day it lacks (or no hash) the latest day; the address is corrected.
 */
function knownPage(hash) {
  if (!DATES.length) return null;
  const day = hash && DATES.find((d) => d.date === hash.date);
  const page = day && (!hash.report || day.reports.includes(hash.report))
    ? { date: hash.date, report: hash.report }
    : { date: day ? day.date : DATES[0].date, report: null };
  // Also a route with something after it (#date/report/more): the address is the page's own.
  const own = `#${pageKey(page.date, page.report)}`;
  if (location.hash !== own) history.replaceState(null, '', own);
  return page;
}
window.addEventListener('popstate', followHash);
window.addEventListener('hashchange', followHash);

// ← and → change the day (as the bar's arrows do), / opens search. Not while typing or in a dialog.
document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  if (calDlg.open || searchDlg.open || e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key === '/') {
    e.preventDefault();
    openSearch();
    return;
  }
  // Shift with an arrow extends a text selection ("/" itself needs Shift on some layouts).
  if (e.shiftKey) return;
  const step = e.key === 'ArrowLeft' ? 'prevDay' : e.key === 'ArrowRight' ? 'nextDay' : null;
  const href = step && document.getElementById(step).getAttribute('href');
  if (href) location.hash = href;
});

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates, labels, weekly, colors, feeds, overview, comingUp, talkedAbout, policyTalk, highlights, proseColumns } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    LABELS = labels ?? {};
    DATES = dates;
    WEEKLY = weekly ?? [];
    COLORS = colors ?? {};
    FEEDS = feeds ?? {};
    OVERVIEW_LABEL = overview ?? 'Overview';
    COMING_UP_HEADING = comingUp ?? 'Coming up';
    TALKED_ABOUT_HEADING = talkedAbout ?? 'Also talked about';
    POLICY_TALK_HEADING = policyTalk ?? 'Policy talk';
    HIGHLIGHTS_HEADING = highlights ?? 'Highlights';
    PROSE_COLUMNS = proseColumns ?? PROSE_COLUMNS;

    allDates = dates;
    buildCalendar(dates);
    document.getElementById('brand').href = `#${dates[0].date}`;

    // A known report or day from the hash, else that day's or the latest day's overview.
    const page = knownPage(getHash());
    await loadReport(page.date, page.report, false);
  } catch (e) {
    setContent(
      `<div class="note"><p>The list of reports did not load (${escapeHtml(e.message)}).</p>` +
      '<p>Reload the page to try again.</p></div>',
    );
  }
})();
</script>
</body>
</html>
