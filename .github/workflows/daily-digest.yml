name: Daily Diff

on:
  schedule:
    # The digest is wanted by 05:00 Amsterdam time, but GitHub creates this
    # workflow's scheduled runs 2.5–4 h late: 2h32m–3h50m on every run from
    # 2026-09-29 to 10-11, when the cron was 22:37 UTC. So the cron is set at
    # 01:07, which lands the start around 03:40–05:00. If the delay changes,
    # move the cron, not the timezone. GitHub applies Amsterdam's DST itself.
    # Report dates and the Monday weekly run are CST, the same calendar day
    # as Amsterdam at that hour.
    #
    # The minute is deliberately off the hour. GitHub queues scheduled runs and
    # drops them under load, and the :00 slot is the most contended one. At
    # "0 23 * * *" (UTC) this workflow degraded badly in August 2026: the 08-26
    # run was dispatched 5h07m late and the 08-27 run was never created at all.
    - cron: "7 1 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Also generate the weekly reports (trending, models) and the Dev.to/Lobste.rs sections — e.g. to redo a missed Monday"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# A late scheduled run must not overlap a manual catch-up run: both would build
# the same CST day's digest and open a duplicate set of issues (as happened on
# 2026-08-27, which produced 18 duplicates). Queue rather than cancel, so the
# scheduled run reaches the guard job below only after the manual one has
# committed its digest — and then skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Skip a scheduled run when today's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            echo "digests/$DATE is already committed — a manual run covered today. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digests/$DATE yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Free model; if OpenRouter retires it, runs abort at the LLM health gate — swap the id here.
          # Nemotron 3 Ultra's free endpoint was down on 2026-10-16 (16% uptime that day), so Super leads.
          OPENROUTER_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          # Tried in order when the model above errors or is down; one free endpoint is no guarantee.
          OPENROUTER_FALLBACK_MODELS: nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3.5-super-vl:free
          # Without this the reasoning model spends the whole token budget thinking and returns empty content.
          OPENROUTER_REASONING_EFFORT: low
          # Jev relevance ranking for the ArXiv report (~$0.02/day); unset falls back to recency.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Open States (Policy Watch, US states); unset skips that source.
          PLURAL_API_KEY: ${{ secrets.PLURAL_API_KEY }}
          # api.data.gov key: Congress.gov and Regulations.gov (Policy Watch, US federal); unset skips those two.
          USA_GOV_API_KEY: ${{ secrets.USA_GOV_API_KEY }}
          DIGEST_REPO: ${{ github.repository }}
          DIGEST_FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
        run: pnpm start

      # One push per run: every push to main starts a Pages build, and when the
      # digest and the manifest were pushed seconds apart Pages cancelled the
      # first build on every run. The pull comes before `pnpm manifest`, so the
      # rebase only replays digests/ (which only this workflow writes) and the
      # manifest covers whatever landed on main during the run.
      - name: Commit and push digest, manifest and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
          fi
          git pull --rebase
          pnpm manifest
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
          fi
          git push

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PAGES_URL deliberately unset: scheduled runs have no github.event.repository,
          # so notify.ts derives the URL from GITHUB_REPOSITORY instead.
        run: pnpm notify

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale

