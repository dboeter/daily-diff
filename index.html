<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Diff</title>
  <meta name="description" content="AI coding agents, AI policy and the data engineering stack, every morning.">
  <link rel="icon" href="./favicon-16.svg" type="image/svg+xml">
  <!-- apple-touch-icon.png and feed-icon.png are PNG renders of favicon.svg, og-image.png sets it beside the wordmark: iOS, link previews and RSS take no SVG. og:image needs an absolute URL. -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily Diff">
  <meta property="og:description" content="AI coding agents, AI policy and the data engineering stack, every morning.">
  <meta property="og:url" content="https://dboeter.github.io/daily-diff/">
  <meta property="og:image" content="https://dboeter.github.io/daily-diff/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="daily diff: a plus over a minus in a diff gutter, beside the wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="Daily Diff RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    /* Green and red mean added and going away (the diff gutter); nothing else uses them.
       --dim is for rules and scrollbars only: it fails contrast as text. */
    :root {
      --bg:         #0E1110;
      --bg-side:    #0B0E0D;
      --bg-hover:   #151917;
      --bg-active:  #1A1F1C;
      --border:     #232A26;
      --text:       #DCE3DE;
      --muted:      #8C968F;
      --dim:        #3A423D;
      --added:      #4CC38A;
      --added-bg:   rgba(76,195,138,0.08);
      --removed:    #F0716A;
      --removed-bg: rgba(240,113,106,0.08);
      --code-bg:    #151917;
      --link:       #8DBBFF;
      /* The mark stays a dark tile in both themes: its green and red are fixed (logo colors). */
      --mark-bg:    #1A1F1C;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    [data-theme="light"] {
      --bg:         #FBFBF8;
      --bg-side:    #F3F3EE;
      --bg-hover:   #ECECE6;
      --bg-active:  #E3E4DD;
      --border:     #DCDCD4;
      --text:       #151917;
      --muted:      #59625C;
      --dim:        #C4C8C0;
      --added:      #1A7F4E;
      --added-bg:   rgba(26,127,78,0.07);
      --removed:    #BF3A31;
      --removed-bg: rgba(191,58,49,0.07);
      --code-bg:    #F0F0EA;
      --link:       #1F5FBF;
      --mark-bg:    #151917;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow: hidden;
    }
    /* A report's square (REPORTS color in src/core/strings.ts, manifest `colors`); set as --tile. */
    .tile {
      display: inline-block; flex-shrink: 0; width: 10px; height: 10px; border-radius: 2px;
      background: var(--tile, var(--muted));
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    #hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 50px;
      background: var(--bg-side); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand {
      font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -0.03em;
      display: flex; align-items: center; gap: 10px;
    }
    .mark { display: block; flex-shrink: 0; }
    .hdr-right { display: flex; align-items: center; gap: 6px; }
    .hdr-btn {
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      background: none; border: 1px solid var(--border); color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .hdr-btn:hover { border-color: var(--muted); color: var(--text); }
    .hdr-btn svg { display: block; }
    /* The theme button shows the theme it switches to. */
    [data-theme="dark"] #themeBtn .icon-moon, [data-theme="light"] #themeBtn .icon-sun { display: none; }

    /* ── Body ── */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--bg-side); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 10px 0;
    }
    #sidebar::-webkit-scrollbar { width: 3px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    .side-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); padding: 4px 16px 8px;
    }
    .search-wrap { padding: 0 12px 10px; }
    #searchInput {
      width: 100%; height: 34px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 13px;
    }
    #searchInput:focus { outline: 2px solid var(--link); outline-offset: -1px; }
    #searchStatus {
      min-height: 14px; margin-top: 4px;
      font-size: 12px; color: var(--muted);
    }
    /* ── Month group ── */
    .month-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px; cursor: pointer;
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: color 0.15s; user-select: none;
    }
    .month-hdr:hover, .month-hdr.lit { color: var(--text); }
    .month-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .month-group.open .month-body { max-height: 9999px; }
    .month-group.open > .month-hdr .arr { transform: rotate(90deg); }

    .date-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 6px 24px; cursor: pointer;
      font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--muted);
      transition: color 0.15s; user-select: none;
    }
    .date-hdr:hover, .date-hdr.lit { color: var(--text); }
    .date-hdr.search-hit { color: var(--link); }
    /* The newest run: its day and a tag, so it stands out from the archive. Not green: green means added. */
    .date-hdr.latest { color: var(--text); font-weight: 600; }
    .run-tag {
      margin-left: 4px; padding: 1px 6px; border: 1px solid var(--link); border-radius: 4px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--link);
    }
    .arr { font-size: 8px; transition: transform 0.2s; display: inline-block; }
    .date-group.open .arr { transform: rotate(90deg); }
    .rpt-list { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
    .date-group.open .rpt-list { max-height: 600px; }
    .rpt-btn {
      display: flex; align-items: center; gap: 10px;
      width: calc(100% - 16px); margin: 0 8px; padding: 6px 8px 6px 24px;
      background: none; border: none; border-radius: 6px;
      text-align: left; cursor: pointer; font-family: inherit; font-size: 14px;
      color: var(--muted); transition: color 0.1s, background 0.1s;
    }
    .rpt-btn:hover { background: var(--bg-hover); color: var(--text); }
    .rpt-btn.active { color: var(--text); background: var(--bg-active); font-weight: 600; }
    .rpt-btn .when { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }

    /* ── Page nav, table of contents, overview ── */
    .page-nav {
      display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between;
      margin-bottom: 24px; font-family: var(--mono); font-size: 12px;
    }
    .page-nav a { color: var(--muted); text-decoration: none; }
    .page-nav a:hover { color: var(--text); }
    .page-nav .mid { flex: 1; text-align: center; }
    .md details.toc > *:not(summary) { padding: 8px 14px 8px 34px; margin: 0; }
    .md details.toc li { margin-bottom: 2px; }
    .md details.toc li.sub { margin-left: 16px; list-style: circle; }
    .md .dim { color: var(--muted); font-style: italic; }
    .side-group-hdr {
      padding: 6px 16px; font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .this-week { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    /* ── Content ── */
    #cwrap { flex: 1; overflow-y: auto; }
    #cwrap::-webkit-scrollbar { width: 5px; }
    #cwrap::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
    #content { max-width: 820px; margin: 0 auto; padding: 36px 48px 72px; }

    .msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
      height: 240px; color: var(--muted); font-size: 13px;
    }
    .msg-icon { font-size: 36px; opacity: 0.5; }

    @keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .fade { animation: fadein 0.3s ease; }

    /* ── Markdown ── */
    .md {
      font-family: var(--sans);
      font-size: 16px; line-height: 1.65; color: var(--text);
    }
    .md h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; line-height: 1.25; letter-spacing: -0.02em; }
    /* A report's H1 carries its square (--tile on .md, set by decorateReport). */
    .md.report > h1:first-child { display: flex; align-items: center; gap: 12px; }
    .md.report > h1:first-child::before {
      content: ''; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px;
      background: var(--tile, var(--muted));
    }
    .md h2 { font-size: 20px; font-weight: 600; margin: 36px 0 12px; letter-spacing: -0.01em; }
    .md h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
    .md h4 { font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .md p { margin-bottom: 12px; }
    .md a { color: var(--link); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md strong { font-weight: 600; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .md ul, .md ol { padding-left: 22px; margin-bottom: 12px; }
    .md li { margin-bottom: 4px; }
    .md li > ul, .md li > ol { margin-top: 4px; margin-bottom: 0; }
    .md blockquote { border-left: 2px solid var(--border); padding: 4px 16px; margin: 12px 0; color: var(--muted); }
    /* A report's header block: H1, report bar as tabs, meta line (withReportBar in
       src/reports/markdown.ts; decorateReport turns the bar into tabs). Reports from
       before the bar go straight from the H1 to the meta line. */
    .md .report-tabs {
      display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 18px 0 0;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .md .report-tabs a, .md .report-tabs span { padding-bottom: 10px; color: var(--muted); }
    .md .report-tabs a:hover { color: var(--text); text-decoration: none; }
    .md .report-tabs [aria-current] {
      color: var(--text); font-weight: 600; padding-bottom: 8px;
      border-bottom: 2px solid var(--tile, var(--text));
    }
    .md blockquote.report-meta {
      border: none; padding: 0; margin: 10px 0 16px;
      font-family: var(--mono); font-size: 13px; color: var(--muted);
    }
    .md blockquote.report-meta p { margin: 0; }
    .md code {
      font-family: var(--mono); font-size: 0.85em;
      background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
    }
    .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 14px 0; }
    .md pre code { background: none; padding: 0; font-size: 13px; }
    .md table {
      width: 100%; border-collapse: collapse; margin: 14px 0;
      font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--text);
    }
    .md th {
      padding: 8px 14px 8px 0; border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    .md td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .md th:last-child, .md td:last-child { padding-right: 0; }
    .md td.date { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .md details { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden; }
    .md summary {
      cursor: pointer; padding: 8px 14px;
      font-size: 13px; color: var(--muted);
      background: var(--code-bg); user-select: none; list-style: none;
      display: flex; align-items: center; gap: 8px; transition: color 0.15s;
    }
    .md h2 .tile { margin-right: 10px; vertical-align: 0.1em; }
    /* Highlights as a diff hunk: + for what arrived, − for what is going away (gutterList). */
    .md ul.gutter { list-style: none; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .md ul.gutter > li { position: relative; margin: 0; padding: 10px 14px 10px 40px; background: var(--added-bg); }
    .md ul.gutter > li + li { border-top: 1px solid var(--border); }
    .md ul.gutter > li::before {
      content: '+'; position: absolute; left: 0; width: 40px; text-align: center;
      font-family: var(--mono); font-weight: 600; color: var(--added);
    }
    .md ul.gutter > li.gone { background: var(--removed-bg); }
    .md ul.gutter > li.gone::before { content: '−'; color: var(--removed); }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    .md details[open] summary::before { content: '▼'; }
    .md summary:hover { color: var(--text); }
    .md details > *:not(summary) { padding: 12px 14px; }

    /* ── Mobile ── */
    #mob-toggle { display: none; }
    @media (max-width: 680px) {
      #hdr { padding: 0 12px; }
      body { overflow: auto; }
      #app { height: auto; min-height: 100vh; }
      #body { flex-direction: column; overflow: visible; }
      #cwrap { overflow: visible; }
      #sidebar {
        width: 100%; border-right: none; border-bottom: 1px solid var(--border);
        max-height: 48px; overflow: hidden; padding: 0;
        transition: max-height 0.3s ease;
      }
      #sidebar.open { max-height: 60vh; overflow-y: auto; padding: 0 0 8px; }
      #mob-toggle {
        display: flex; align-items: center; gap: 8px;
        height: 48px; padding: 0 16px; cursor: pointer;
        font-size: 14px; color: var(--muted); border-bottom: 1px solid transparent;
        transition: color 0.15s;
      }
      #mob-toggle:hover { color: var(--text); }
      #sidebar.open #mob-toggle { border-bottom-color: var(--border); }
      .side-label { margin-top: 8px; }
      #content { padding: 20px 16px 48px; }
      .md table.stack, .md table.stack tbody { display: block; }
      .md table.stack thead { display: none; }
      .md table.stack tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--border); }
      /* Inline, so a long title wraps as text and its separator stays on the line before it. */
      .md table.stack td { display: inline; padding: 0; border: 0; font-size: 13px; color: var(--muted); }
      .md table.stack td:not(:empty):not(.prose) ~ td:not(:empty):not(.prose)::before { content: '·'; margin: 0 6px; }
      .md table.stack td.prose { display: block; margin-top: 4px; font-size: 14px; color: var(--text); }
      .md table.stack td:empty { display: none; }
      .md { font-size: 15px; }
      .md h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- The mark: a diff gutter, + over −. favicon-16.svg is the tab icon, redrawn on a 16 px grid (whole-pixel shapes, square ends) so it stays sharp; favicon.svg is this drawing on a fixed background, the source of the PNG renders (banner.png too). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="var(--mark-bg)"/>
      <g stroke-width="7" stroke-linecap="round">
        <path d="M13.5 25.5h15M21 18v15M39.5 25.5h11" stroke="#4CC38A"/>
        <path d="M13.5 45.5h15M39.5 45.5h4" stroke="#F0716A"/>
      </g>
    </symbol>
  </svg>
  <div id="hdr">
    <div class="brand">
      <svg class="mark" width="24" height="24" aria-hidden="true"><use href="#mark"/></svg>
      <span>daily diff</span>
    </div>
    <div class="hdr-right">
      <!-- Header icons on the 16 px grid they render at, 2 px round strokes like the mark; zero-length round-capped strokes (h0) are the dots. GitHub's is its own mark, unchanged. -->
      <a id="rssLink" class="hdr-btn" href="./feed.xml" title="RSS feed" aria-label="RSS feed">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8a5 5 0 0 1 5 5M3 3a10 10 0 0 1 10 10M3 13h0"/></svg>
      </a>
      <a class="hdr-btn" href="https://github.com/dboeter/daily-diff" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <button id="themeBtn" class="hdr-btn" type="button">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5h0M8 14.5h0M1.5 8h0M14.5 8h0M3.4 3.4h0M12.6 3.4h0M3.4 12.6h0M12.6 12.6h0"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14.5 9.6A6.75 6.75 0 1 1 6.4 1.5a6 6 0 0 0 8.1 8.1z"/></svg>
      </button>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        ☰ &nbsp;Select report
      </div>
      <div class="side-label">REPORTS</div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search all reports, e.g. Claude">
        <div id="searchStatus"></div>
      </div>
      <div id="nav"></div>
    </div>

    <div id="cwrap">
      <div id="content">
        <div class="msg"><div>Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

// Report id → label, from manifest.json (`labels`, written from REPORT_LABELS in src/core/strings.ts).
let LABELS = {};

// ── Theme ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('ar-theme') || 'dark';

function applyTheme(t) {
  theme = t;
  htmlEl.dataset.theme = t;
  const label = `Switch to ${t === 'dark' ? 'light' : 'dark'} theme`;
  themeBtn.title = label;
  themeBtn.setAttribute('aria-label', label);
  localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

// ── Routing ──
// #YYYY-MM-DD/report is a report, #YYYY-MM-DD the day's overview.
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) ? { date, report: report || null } : null;
}

const pageKey = (date, report) => (report ? `${date}/${report}` : date);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Manifest data: dates newest first, the weekly report ids, the overview's
// label (OVERVIEW in src/core/strings.ts), its Coming up heading (COMING_UP) and the
// Highlights heading (SECTIONS).
let DATES = [];
let WEEKLY = [];
let COLORS = {};
let OVERVIEW_LABEL = 'Overview';
let COMING_UP_HEADING = 'Coming up';
let TALKED_ABOUT_HEADING = 'Also talked about';
let POLICY_TALK_HEADING = 'Policy talk';
let HIGHLIGHTS_HEADING = 'Highlights';
let PROSE_COLUMNS = ['Summary', 'What to do'];

// ── State ──
let currentKey = null;
let searchIndex = null;
let searchReady = false;
let searchQuery = '';
let searchDebounce = null;

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

function applyDateSearch(query) {
  const needle = query.trim().toLowerCase();
  let hits = 0;

  document.querySelectorAll('.date-group').forEach((grp) => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;

    if (!needle || !searchIndex) {
      hdr.classList.remove('search-hit');
      return;
    }

    const text = searchIndex.get(grp.dataset.date) || '';
    const matched = text.includes(needle);
    hdr.classList.toggle('search-hit', matched);
    if (matched) hits += 1;
  });

  if (!needle) {
    setSearchStatus('');
  } else if (!searchReady) {
    setSearchStatus('Building index…');
  } else {
    setSearchStatus(`${hits} day(s) matched`);
  }
}

async function buildSearchIndex(dates) {
  const index = new Map();
  dates.forEach(({ date }) => index.set(date, ''));

  // Flatten into a single task list and drain with a small worker pool so we
  // never flood the browser's connection pool (a fetch storm here was starving
  // the primary content fetch and causing "Failed to fetch" on initial load).
  const tasks = [];
  dates.forEach(({ date, reports }) => {
    reports.forEach((report) => tasks.push({ date, report }));
  });

  const chunks = new Map(dates.map(({ date }) => [date, []]));
  let cursor = 0;
  const worker = async () => {
    while (cursor < tasks.length) {
      const { date, report } = tasks[cursor++];
      try {
        const res = await fetch(`./digests/${date}/${report}.md`);
        if (res.ok) chunks.get(date).push(await res.text());
      } catch {
        /* ignore — missing report just won't be searchable */
      }
    }
  };
  const POOL = 6;
  await Promise.all(Array.from({ length: POOL }, worker));

  chunks.forEach((arr, date) => index.set(date, arr.join('\n').toLowerCase()));
  return index;
}

function initSearch(dates) {
  searchReady = false;
  setSearchStatus('Preparing index…');

  buildSearchIndex(dates).then((index) => {
    searchIndex = index;
    searchReady = true;
    applyDateSearch(searchQuery);
    if (!searchQuery.trim()) setSearchStatus('');
  });
}

let allDates = null;
let searchInitialized = false;

function ensureSearchIndex() {
  if (searchInitialized || !allDates) return;
  searchInitialized = true;
  initSearch(allDates);
}

searchInput.addEventListener('focus', ensureSearchIndex);
searchInput.addEventListener('input', () => {
  ensureSearchIndex();
  searchQuery = searchInput.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => applyDateSearch(searchQuery), 120);
});

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

async function fetchReport(date, report) {
  let res;
  // Retry transient failures: network errors and statuses that may recover
  // on their own (5xx, 429). A 4xx like 404 means the report is really
  // missing (manifest/digests drift) — fail immediately instead of
  // stalling the error behind three retries and backoff.
  for (let attempt = 0; ; attempt++) {
    try {
      res = await fetch(`./digests/${date}/${report}.md`);
      if (res.ok || (res.status < 500 && res.status !== 429) || attempt >= 2) break;
    } catch (netErr) {
      if (attempt >= 2) throw netErr;
    }
    await new Promise((r) => setTimeout(r, 300 * (attempt + 1)));
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

/** Previous/next day and, for a report, the day of its previous report (weekly reports skip days). */
function pageNav(date, report) {
  const i = DATES.findIndex((d) => d.date === date);
  if (i === -1) return '';
  const older = DATES[i + 1];
  const newer = DATES[i - 1];
  // The same report on that day when it has one, else that day's overview.
  const href = (d) => `#${pageKey(d.date, report && d.reports.includes(report) ? report : null)}`;
  const prevReportDay = report ? DATES.slice(i + 1).find((d) => d.reports.includes(report)) : null;
  const left = older ? `<a href="${href(older)}">← ${older.date}</a>` : '<span></span>';
  const prev = prevReportDay && prevReportDay !== older
    ? `<a href="#${pageKey(prevReportDay.date, report)}">Previous ${escapeHtml(LABELS[report] || report)}: ${prevReportDay.date}</a>`
    : '';
  const mid = `<span class="mid">${prev}</span>`;
  const right = newer ? `<a href="${href(newer)}">${newer.date} →</a>` : '<span></span>';
  return `<nav class="page-nav">${left}${mid}${right}</nav>`;
}

/** The day's highlights (highlights.json, also sent to Telegram), each report's under a link to it, then Policy talk and Also talked about (talked-about.json, split by `topic`), then Coming up (coming-up.json). */
async function renderOverview(date) {
  const entry = DATES.find((d) => d.date === date);
  if (!entry) throw new Error('unknown date');
  let highlights = {};
  try {
    const res = await fetch(`./digests/${date}/highlights.json`);
    if (res.ok) highlights = await res.json();
  } catch {
    /* older days have no highlights.json: the overview is then a list of links */
  }
  const parts = [`<h1>${escapeHtml(date)}</h1>`];
  for (const id of entry.reports) {
    parts.push(`<h2>${tileHtml(id)}<a href="#${pageKey(date, id)}">${escapeHtml(LABELS[id] || id)}</a></h2>`);
    const items = Array.isArray(highlights[id]) ? highlights[id] : [];
    parts.push(items.length
      ? `<ul class="highlights">${items.map((h) => `<li>${escapeHtml(h)}</li>`).join('')}</ul>`
      : '<p class="dim">No highlights picked.</p>');
  }
  let talked = [];
  try {
    const res = await fetch(`./digests/${date}/talked-about.json`);
    if (res.ok) talked = await res.json();
  } catch {
    /* days before talked-about.json have no Also talked about section */
  }
  if (!Array.isArray(talked)) talked = [];
  // Story links reach this HTML without DOMPurify: only http(s) becomes a link.
  const link = (url, text) => /^https?:\/\//i.test(url) ? `<a href="${escapeHtml(url)}">${escapeHtml(text)}</a>` : escapeHtml(text);
  // Policy stories have their own list; every row carries `topic`, so older days split the same way.
  for (const [heading, rows] of [
    [POLICY_TALK_HEADING, talked.filter((t) => t.topic === 'policy')],
    [TALKED_ABOUT_HEADING, talked.filter((t) => t.topic !== 'policy')],
  ]) {
    if (!rows.length) continue;
    parts.push(`<h2>${escapeHtml(heading)}</h2>`);
    parts.push(`<ul>${rows.map((t) =>
      `<li>${link(t.url, t.title)} <span class="dim">${link(t.discussionUrl, t.counts ?? `${t.points} points, ${t.comments} comments`)}</span></li>`,
    ).join('')}</ul>`);
  }
  let comingUp = [];
  try {
    const res = await fetch(`./digests/${date}/coming-up.json`);
    if (res.ok) comingUp = await res.json();
  } catch {
    /* days before coming-up.json have no Coming up section */
  }
  if (Array.isArray(comingUp) && comingUp.length) {
    parts.push(`<h2>${escapeHtml(COMING_UP_HEADING)}</h2>`);
    // Feed links reach this HTML without DOMPurify: only http(s) becomes a link.
    const linked = (c) => /^https?:\/\//i.test(c.link)
      ? `<a href="${escapeHtml(c.link)}">${escapeHtml(c.title)}</a>`
      : escapeHtml(c.title);
    parts.push(`<ul>${comingUp.map((c) =>
      `<li>${typeof c.date === 'string' && ISO_DATE.test(c.date) ? timeHtml(c.date, date) : escapeHtml(c.date)} · ${linked(c)} <span class="dim">${escapeHtml(LABELS[c.page] || c.page)}</span></li>`,
    ).join('')}</ul>`);
  }
  return parts.join('');
}

// Highlights carry the gutter sign (GOING_AWAY in src/core/strings.ts) from this date on: it opens
// one going away, the rest are additions. Earlier days have no signs, so no gutter.
const SIGNED_SINCE = '2026-10-24';
const GOING_AWAY = '−';

/** A Highlights list as a diff hunk; the sign moves from the text to the gutter. */
function gutterList(ul) {
  ul.classList.add('gutter');
  for (const li of ul.children) {
    // A loose list (blank lines between items) wraps each item's text in a <p>.
    const first = li.firstElementChild?.tagName === 'P' ? li.firstElementChild.firstChild : li.firstChild;
    if (first?.nodeType === Node.TEXT_NODE && first.textContent.startsWith(`${GOING_AWAY} `)) {
      first.textContent = first.textContent.slice(GOING_AWAY.length + 1);
      li.classList.add('gone');
    }
  }
}

/** A report's square; a retired report has no color in the manifest and gets the neutral one. */
function tileHtml(id) {
  const color = COLORS[id];
  return color ? `<span class="tile" style="--tile:${escapeHtml(color)}"></span>` : '<span class="tile"></span>';
}

/** The report bar line: links (the current report in bold) joined by " · " (renderReportBar). */
function isReportBar(p) {
  return p.querySelectorAll('a').length >= 2 && [...p.childNodes].every((n) =>
    n.nodeType === Node.TEXT_NODE ? /^[\s·]*$/.test(n.textContent) : n.tagName === 'A' || n.tagName === 'STRONG');
}

/**
 * The report's square on its H1, the report bar as tabs and the meta line under them. The bar
 * stays one Markdown line for GitHub Issues; its emoji give way to the squares here.
 */
function decorateReport(root, date, report) {
  root.classList.add('report');
  if (date >= SIGNED_SINCE) {
    const highlights = [...root.querySelectorAll(':scope > h2')].find((h) => h.textContent.trim() === HIGHLIGHTS_HEADING);
    const list = highlights?.nextElementSibling;
    if (list?.tagName === 'UL') gutterList(list);
  }
  if (COLORS[report]) root.style.setProperty('--tile', COLORS[report]);
  const h1 = root.querySelector(':scope > h1:first-child');
  if (!h1) return;
  let next = h1.nextElementSibling;
  if (next?.tagName === 'P' && isReportBar(next)) {
    const tabs = document.createElement('nav');
    tabs.className = 'report-tabs';
    tabs.setAttribute('aria-label', 'Reports of this day');
    for (const el of next.children) {
      const tab = document.createElement(el.tagName === 'A' ? 'a' : 'span');
      if (el.tagName === 'A') tab.href = el.getAttribute('href');
      else tab.setAttribute('aria-current', 'page');
      tab.textContent = el.textContent.replace(/^[^\p{L}\p{N}]+/u, '');
      tabs.appendChild(tab);
    }
    next.replaceWith(tabs);
    next = tabs.nextElementSibling;
  }
  if (next?.tagName === 'BLOCKQUOTE') next.classList.add('report-meta');
  for (const td of root.querySelectorAll('td')) {
    const iso = td.textContent.trim();
    if (!ISO_DATE.test(iso)) continue;
    td.classList.add('date');
    // Only a bare date: one the model linked or emphasized keeps its markup.
    if (!td.children.length) td.innerHTML = timeHtml(iso, date);
  }
  // On a phone a row of 3+ columns stacks: its cells on one line, a prose column (Summary,
  // What to do) under them at full width. Columns no longer align, so the header is hidden.
  for (const table of root.querySelectorAll('table')) {
    const headers = [...table.querySelectorAll('thead th')].map((th) => th.textContent.trim());
    if (headers.length < 3) continue;
    table.classList.add('stack');
    headers.forEach((h, i) => {
      if (!PROSE_COLUMNS.includes(h)) return;
      for (const td of table.querySelectorAll(`tbody td:nth-child(${i + 1})`)) td.classList.add('prose');
    });
  }
}

const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/** "21 Oct", with the year only when it is not the page's own; the ISO date stays in datetime and title. */
function timeHtml(iso, pageDate) {
  const [y, m, d] = iso.split('-');
  const label = `${Number(d)} ${MONTHS[Number(m) - 1]}${y === pageDate.slice(0, 4) ? '' : ` ${y}`}`;
  return `<time datetime="${iso}" title="${iso}">${label}</time>`;
}

/**
 * A collapsible table of contents before the first section of a long report:
 * 4+ `##` sections, or 4+ `##` and `###` together. The agents report has only
 * 3 `##` (stealth models and its two groups); its projects are `###`.
 */
function addToc(root) {
  let heads = [...root.querySelectorAll('h2')];
  if (heads.length < 4) heads = [...root.querySelectorAll('h2, h3')];
  if (heads.length < 4) return;
  const toc = document.createElement('details');
  toc.className = 'toc';
  const summary = document.createElement('summary');
  summary.textContent = `Contents (${heads.length})`;
  const list = document.createElement('ol');
  heads.forEach((h) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = h.textContent;
    // The hash holds the route, so scroll instead of linking to an anchor.
    a.onclick = (e) => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
    const li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'sub';
    li.appendChild(a);
    list.appendChild(li);
  });
  toc.append(summary, list);
  heads[0].before(toc);
}

async function loadReport(date, report, push = true) {
  const key = pageKey(date, report);
  if (key === currentKey) return;
  currentKey = key;

  // Retry of the same report (e.g. after a failed load) already has this
  // hash in session history — pushing again would need a second back-press.
  if (push && location.hash !== `#${key}`) history.pushState(null, '', `#${key}`);

  // Sync sidebar
  document.querySelectorAll('.rpt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    const hasActive = grp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    const hasActive = mGrp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) {
      g.classList.add('open');
      // Also open parent month group
      const monthGrp = g.closest('.month-group');
      if (monthGrp) monthGrp.classList.add('open');
    }
  });

  // Close mobile sidebar and reset its inner scroll — a retained scrollTop
  // pushes the toggle row out of the collapsed 48px strip, making the bar
  // look like it vanished (and it can't be clicked to reopen). Only reset
  // when an expanded mobile sidebar is actually being collapsed, so the
  // scroll position of the desktop 300px list is preserved.
  const sidebar = document.getElementById('sidebar');
  const wasOpen = sidebar.classList.contains('open');
  sidebar.classList.remove('open');
  if (wasOpen) sidebar.scrollTop = 0;

  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>Loading…</div></div>');
  cwrap.scrollTop = 0;

  try {
    const html = report ? renderMarkdown(await fetchReport(date, report)) : await renderOverview(date);
    // Drop the response if the user has navigated to another page while
    // this fetch was in flight, so a slow stale reply can't overwrite it.
    if (currentKey !== key) return;
    setContent(`${pageNav(date, report)}<div class="md fade">${html}</div>`);
    if (report) {
      const md = document.querySelector('#content .md');
      decorateReport(md, date, report);
      addToc(md);
    } else if (date >= SIGNED_SINCE) {
      document.querySelectorAll('#content ul.highlights').forEach(gutterList);
    }
  } catch (e) {
    // The user has already switched to another report — don't overwrite its
    // content with this stale request's error.
    if (currentKey !== key) return;
    // Reset the guard so clicking the same report again retries; otherwise
    // the early-return above turns every further click into a silent no-op
    // and the only way out is loading a different report first.
    currentKey = null;
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>Failed to load: ${e.message}</div></div>`);
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group' + (isFirst ? ' open' : '');
  grp.dataset.date = date;

  const hdr = document.createElement('div');
  hdr.className = 'date-hdr' + (isFirst ? ' latest' : '');
  // Show only the day part (DD) since month is already in the parent header
  const dayLabel = date.slice(8); // "03" from "2026-04-03"
  const dateText = document.createTextNode(dayLabel + '\u00a0');
  const arrSpan = document.createElement('span');
  arrSpan.className = 'arr';
  arrSpan.textContent = '▶';
  // The day and its tag in one span: the header spreads its children apart (space-between).
  const label = document.createElement('span');
  label.appendChild(dateText);
  if (isFirst) {
    // The newest run is "today" on the viewer's own date ('sv' formats as YYYY-MM-DD), else "latest".
    const tag = document.createElement('span');
    tag.className = 'run-tag';
    tag.textContent = date === new Date().toLocaleDateString('sv') ? 'today' : 'latest';
    label.appendChild(tag);
  }
  hdr.appendChild(label);
  hdr.appendChild(arrSpan);
  hdr.onclick = () => grp.classList.toggle('open');

  const list = document.createElement('div');
  list.className = 'rpt-list';

  const overview = document.createElement('button');
  overview.className = 'rpt-btn';
  overview.dataset.key = pageKey(date, null);
  overview.innerHTML = `${tileHtml(null)}${escapeHtml(OVERVIEW_LABEL)}`;
  overview.onclick = () => loadReport(date, null);
  list.appendChild(overview);

  reports.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rpt-btn';
    btn.dataset.key = `${date}/${r}`;
    btn.innerHTML = `${tileHtml(r)}${escapeHtml(LABELS[r] || r)}`;
    btn.onclick = () => loadReport(date, r);
    list.appendChild(btn);
  });

  grp.append(hdr, list);
  return grp;
}

/**
 * The latest report of each weekly kind, pinned above the archive until the
 * next weekly run replaces it. Counted from today, not from the newest day in
 * the manifest, so a report stops passing for this week's when runs stop too.
 * 8 days, not 7: a date parses as 00:00 UTC, and the next Monday's run (01:07
 * Amsterdam, started hours late) lands a few hours into the 8th day.
 */
function buildThisWeek(nav, dates) {
  const now = Date.now();
  const latest = WEEKLY
    .map((id) => ({ id, entry: dates.find((d) => d.reports.includes(id)) }))
    .filter((x) => x.entry && now - Date.parse(x.entry.date) < 8 * 86400000);
  if (!latest.length) return;
  const grp = document.createElement('div');
  grp.className = 'this-week';
  const hdr = document.createElement('div');
  hdr.className = 'side-group-hdr';
  hdr.textContent = 'This week';
  grp.appendChild(hdr);
  latest.forEach(({ id, entry }) => {
    const btn = document.createElement('button');
    btn.className = 'rpt-btn';
    btn.dataset.key = pageKey(entry.date, id);
    btn.innerHTML = `${tileHtml(id)}${escapeHtml(LABELS[id] || id)}<span class="when">${entry.date.slice(5)}</span>`;
    btn.onclick = () => loadReport(entry.date, id);
    grp.appendChild(btn);
  });
  nav.appendChild(grp);
}

function buildNav(dates) {
  const nav = document.getElementById('nav');
  buildThisWeek(nav, dates);

  // Group dates by month (YYYY-MM)
  const months = new Map();
  dates.forEach((entry) => {
    const month = entry.date.slice(0, 7); // "2026-04"
    if (!months.has(month)) months.set(month, []);
    months.get(month).push(entry);
  });

  let isFirstDate = true;
  let isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr';
    const mText = document.createTextNode(month + '\u00a0');
    const mArr = document.createElement('span');
    mArr.className = 'arr';
    mArr.textContent = '▶';
    mHdr.appendChild(mText);
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = 'month-body';

    entries.forEach(({ date, reports }) => {
      mBody.appendChild(buildDateGroup(date, reports, isFirstDate));
      isFirstDate = false;
    });

    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

// Back/forward, and links inside a report (report bar, overview, prev/next):
// a same-page hash link fires hashchange. loadReport ignores the repeat.
const followHash = () => {
  const h = getHash();
  if (h) loadReport(h.date, h.report, false);
};
window.addEventListener('popstate', followHash);
window.addEventListener('hashchange', followHash);

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates, labels, weekly, colors, overview, comingUp, talkedAbout, policyTalk, highlights, proseColumns } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    LABELS = labels ?? {};
    DATES = dates;
    WEEKLY = weekly ?? [];
    COLORS = colors ?? {};
    OVERVIEW_LABEL = overview ?? 'Overview';
    COMING_UP_HEADING = comingUp ?? 'Coming up';
    TALKED_ABOUT_HEADING = talkedAbout ?? 'Also talked about';
    POLICY_TALK_HEADING = policyTalk ?? 'Policy talk';
    HIGHLIGHTS_HEADING = highlights ?? 'Highlights';
    PROSE_COLUMNS = proseColumns ?? PROSE_COLUMNS;

    allDates = dates;
    buildNav(dates);

    // A known report or day from the hash, else the latest day's overview.
    const hash = getHash();
    const day = hash && dates.find(d => d.date === hash.date);
    if (day && (!hash.report || day.reports.includes(hash.report))) {
      await loadReport(hash.date, hash.report, false);
    } else {
      history.replaceState(null, '', `#${dates[0].date}`);
      await loadReport(dates[0].date, null, false);
    }
  } catch (e) {
    document.getElementById('nav').innerHTML =
      '<div class="msg" style="height:80px;font-size:10px">⚠️ ' + e.message + '</div>';
    setContent('<div class="msg"><div>Unable to load manifest.json</div></div>');
  }
})();
</script>
