# Daily Diff configuration
# Edit this file to customize which repositories are tracked, then run
# `pnpm readme` to refresh the tracked-repo tables in README.md (pre-commit and
# CI fail while they are stale). Changes take effect on the next workflow run.
# Every section is required (agents, skills_repo, infra, databricks, snowflake,
# data_stack, policy): the run stops with an error instead of falling back to a
# built-in list.
#
# agents and infra are the two sections of the daily agents report; databricks,
# snowflake and data_stack the repo sections of the daily data report:
#   title    the section's heading in the report
#   subject  what the projects are; the LLM prompt reads "You are a technical
#            editor covering <subject>", and README.md shows it
#   repos    the tracked repositories
# agents and infra also follow the last weekly trending report's category-table
# repos (src/trending/promoted.ts); these lists are the curated core.

# ── Agents ────────────────────────────────────────────────────────────────────
# The first section of the daily agents report. Each agent is covered by its stable releases, a few hot issues (high
# engagement or a regression/security label) and news: HN, Anthropic/OpenAI and
# GitHub Trending items that mention it. Issue and PR churn is not reported.
# Each repo requires: id (slug), repo (owner/repo), name (display name).
# Optional keywords: terms to match in news items. They replace the display
# name and repo name (the full owner/repo always matches). Set them when the
# name is a common word.

agents:
  title: Coding Agents & Assistants
  subject: AI coding agents and personal AI assistants
  repos:
    - id: claude-code
      repo: anthropics/claude-code
      name: Claude Code
    - id: codex
      repo: openai/codex
      name: OpenAI Codex
      keywords: [codex]
    - id: gemini-cli
      repo: google-gemini/gemini-cli
      name: Gemini CLI
    - id: kilo-code
      repo: Kilo-Org/kilocode
      name: Kilo Code
    - id: opencode
      repo: anomalyco/opencode
      name: OpenCode
    - id: pi
      repo: earendil-works/pi
      name: Pi
      # "pi" alone matches Raspberry Pi and every other use of the word.
      keywords: [pi coding agent, pi agent, earendil]
    - id: oh-my-pi
      repo: can1357/oh-my-pi
      name: Oh My Pi
      # No "omp" keyword: it is also Oh My Posh.
    - id: jcode
      repo: 1jehuang/jcode
      name: jcode
    - id: cline
      repo: cline/cline
      name: Cline
    - id: command-code
      repo: CommandCodeAI/command-code
      name: Command Code
      # Publishes no GitHub releases: covered by hot issues and news only.
    - id: deepseek-harness
      repo: deepseek-ai/deepseek-harness
      name: DeepSeek Harness
      # Issues are disabled and every release so far is an alpha/rc. Until a
      # stable release ships, the report covers its notable prereleases.
    - id: hermes-agent
      repo: nousresearch/hermes-agent
      name: Hermes Agent

# ── Claude Code Skills ────────────────────────────────────────────────────────
# No date filter, sorted by community engagement. A section of the weekly
# ai-trending report.

skills_repo: anthropics/skills

# ── Infra ─────────────────────────────────────────────────────────────────────
# The second section of the daily agents report, same pipeline: stable releases,
# hot issues and news. A weekly report of its own until October 2026. Until
# 2026-10-10 this section tracked inference engines (vLLM, llama.cpp, Ollama…).

infra:
  title: Agent Tooling
  subject: AI agent tooling — agent sandboxes, terminal session multiplexers and context-management tools
  repos:
    - id: openshell
      repo: NVIDIA/OpenShell
      name: OpenShell
    - id: herdr
      repo: herdrdev/herdr
      name: herdr
    - id: context-mode
      repo: mksglu/context-mode
      name: context-mode
      # Publishes few releases: often quiet.
    - id: agent-deck
      repo: asheshgoplani/agent-deck
      name: Agent Deck
      # Rarely reaches the hot-issue bar: often quiet.

# ── Data engineering ──────────────────────────────────────────────────────────
# The repo sections of the daily data report (ai-data), for Digital Power's data
# engineers, same pipeline as the agents: stable releases, hot issues and news
# (matched in a pool of their own, with no names-per-item limit: a story naming
# DuckDB, Polars and Iceberg is stack news). A name or repo name that is an
# ordinary word gets keywords. A section
# with nothing new is left out of the report; the report is skipped when all are.
# Checked 2026-10-17, not tracked: dbt-snowflake (archived; dbt adapters have
# published no GitHub release since 2024), dbt-fusion (no releases, issues off),
# Apache Spark, Kafka and Flink (tags only, no GitHub releases), databricks-sdk-py
# (14 generated releases in 30 days).

databricks:
  title: Databricks
  subject: Databricks and the open-source projects Databricks maintains (Delta Lake, Unity Catalog, MLflow, its CLI and dbt adapter)
  repos:
    - id: delta
      repo: delta-io/delta
      name: Delta Lake
      # Never bare "delta": Delta Air Lines, "the delta between", Delta Live Tables.
      keywords: [delta lake, delta-rs, delta-io]
    - id: unity-catalog
      repo: unitycatalog/unitycatalog
      name: Unity Catalog
    - id: mlflow
      repo: mlflow/mlflow
      name: MLflow
      # Its rolling "model-catalog/latest" release is re-created often but keeps
      # its April 2026 published_at, which the release filter reads: never reported.
    - id: databricks-cli
      repo: databricks/cli
      name: Databricks CLI
      # The repo name "cli" would match every story about any CLI.
      keywords: [databricks cli]
    - id: dbt-databricks
      repo: databricks/dbt-databricks
      name: dbt-databricks

snowflake:
  title: Snowflake
  subject: Snowflake's open-source clients and the Apache Polaris catalog Snowflake maintains
  repos:
    - id: snowpark-python
      repo: snowflakedb/snowpark-python
      name: Snowpark Python
    - id: snowflake-connector-python
      repo: snowflakedb/snowflake-connector-python
      name: Snowflake Connector for Python
    - id: polaris
      repo: apache/polaris
      name: Apache Polaris
      # Bare "polaris" is a star, a car brand and many products. Polaris Catalog
      # was its name before it moved to Apache.
      keywords: [apache polaris, polaris catalog]

data_stack:
  title: Open-source data stack
  subject: open-source data engineering tools — transformation, orchestration, ingestion, table formats and query engines
  repos:
    - id: dbt-core
      # Renamed from dbt-labs/dbt-core.
      repo: dbt-labs/dbt
      name: dbt Core
      # Bare "dbt" stays: on HN and GitHub it almost always means this tool, and
      # most stories say "dbt", not "dbt Core". It also matches "dbt-databricks"
      # (a following "-" is allowed), which is dbt news too.
      keywords: [dbt, dbt core, dbt labs]
    - id: sqlmesh
      repo: SQLMesh/sqlmesh
      name: SQLMesh
    - id: airflow
      repo: apache/airflow
      name: Apache Airflow
      # Bare "airflow" is cooling and ventilation on HN.
      keywords: [apache airflow, airflow dag, airflow dags]
    - id: dagster
      repo: dagster-io/dagster
      name: Dagster
    - id: dlt
      repo: dlt-hub/dlt
      name: dlt
      # Bare "dlt" is distributed ledger technology or Databricks' Delta Live
      # Tables. "dlt-hub" also matches "dltHub" and "dlt hub".
      keywords: [dlt-hub, data load tool]
    - id: iceberg
      repo: apache/iceberg
      name: Apache Iceberg
      # Bare "iceberg" is an ordinary word ("the tip of the iceberg").
      keywords: [apache iceberg, iceberg table, iceberg tables, iceberg catalog, pyiceberg]
    - id: duckdb
      repo: duckdb/duckdb
      name: DuckDB
    - id: polars
      repo: pola-rs/polars
      name: Polars
      # Separate py-* and rs-* releases.
    - id: trino
      repo: trinodb/trino
      name: Trino

# ── Data: vendor feeds ────────────────────────────────────────────────────────
# Vendor release notes for the data report (ai-data), from the 2026-10-17 feed
# spike (.scratch/data-watch/issues/01-feed-spike.md); the vendor blogs repeat them.
#   feeds   name, vendor (databricks | snowflake | azure | gcp), url and parser:
#           rss (RSS 2.0), snowflake (release-notes page), snowflake-bcr
#           (behavior-change bundles), bigquery (Atom, one entry per day);
#           categories (rss only): keep an item only when one of its
#           <category> values is listed

data:
  feeds:
    # Azure rather than AWS Databricks (clients are mainly on Azure; 120 of 127
    # titles are shared). Lists some notes twice under different guids.
    - name: Azure Databricks
      vendor: databricks
      url: https://learn.microsoft.com/en-us/azure/databricks/feed.xml
      parser: rss
    - name: Microsoft Fabric
      vendor: azure
      url: https://blog.fabric.microsoft.com/en-us/blog/feed/
      parser: rss
    # All of Azure. Analytics and AI + machine learning are left out: every Azure
    # Databricks update carries both (the Databricks feed covers those).
    - name: Azure updates
      vendor: azure
      url: https://www.microsoft.com/releasecommunications/api/v2/azure/rss
      parser: rss
      categories:
        - Databases
        - Microsoft Fabric
        - Azure SQL Database
        - Azure SQL Managed Instance
        - Azure Database for PostgreSQL
        - Azure Database for MySQL
        - Azure HorizonDB
        - Azure Blob Storage
    - name: Snowflake
      vendor: snowflake
      url: https://docs.snowflake.com/en/release-notes/all-release-notes?bundle=false
      parser: snowflake
    - name: Snowflake behavior changes
      vendor: snowflake
      url: https://docs.snowflake.com/en/release-notes/behavior-changes
      parser: snowflake-bcr
    - name: BigQuery
      vendor: gcp
      url: https://cloud.google.com/feeds/bigquery-release-notes.xml
      parser: bigquery

# ── Policy ────────────────────────────────────────────────────────────────────
# The daily Policy Watch report (ai-policy): AI legislation, regulation and
# official guidance in the EU, the Netherlands and the US.
#   reader_profile  who the report is for; Jev's US impact question reads it
#   watchlist       files that always appear when they move, per jurisdiction;
#                   an item naming an entry skips the Jev drop (lists may be empty)
#   data_law        tokens that mark a kept item as EU data law: it is also
#                   linked from the data report's Worth a Look (may be empty)
#   feeds           RSS news feeds; items older than 7 days are skipped.
#                   jurisdiction: eu | nl | us_federal | us_states | other
#                   jev_only: true for a low-volume feed whose items need not
#                   name AI: every item goes to Jev, and without Jev the feed
#                   is dropped for the run
#                   kind: news for a news & commentary outlet: its items get
#                   their own section after the jurisdiction tables; the
#                   jurisdiction still sets Jev's questions (US: impact)
#                   query: JSON appended URL-encoded as ?query= (the
#                   Rijksoverheid platform's feeds take their search as JSON)

policy:
  # The sector examples are illustrations only: clients span many sectors.
  reader_profile: >-
    An AI practitioner based in the Netherlands, advising commercial companies of
    roughly 500–1,500 employees across many sectors (e.g. retail, insurance,
    banking), mostly serving the Dutch market. They deploy and integrate AI built
    by others, largely from US vendors.
  # Watchlisted items are always kept. Text is matched against each item's title,
  # description and link.
  watchlist:
    # Procedures (yyyy/nnnn(TYPE)) are fetched from the European Parliament API
    # and reported when their stage moves; act numbers (yyyy/nnnn) join the
    # EUR-Lex title search.
    eu:
      - 2025/0359(COD) # Digital Omnibus on AI (amends the AI Act)
      - 2022/0272(COD) # Cyber Resilience Act
      - 2024/1689 # AI Act
      - 2024/2847 # Cyber Resilience Act
      # EU data law, also linked from the data report (data_law below).
      - 2023/2854 # Data Act
      - 2022/868 # Data Governance Act
      - 2022/2555 # NIS2 Directive
    # Tweede Kamer dossier numbers (Kamerstuk): bills, reported from the Tweede
    # Kamer vote on (Eerste Kamer, Staatsblad from KOOP). Dutch implementation
    # acts are named after the EU regulation, so keywords never find them.
    nl:
      - "36875" # Uitvoeringswet verordening cyberweerbaarheid (CRA)
    # Federal Register / Regulations.gov dockets (NIST-2026-0100) and RINs
    # (0693-AB12): documents in them are kept without an AI title. Bills as
    # <type><number>-<congress> (hr10768-119), for AI provisions in non-AI
    # bills (NDAA, appropriations); still reported only from passing a chamber.
    us_federal: []
    us_states: []
  # Matched like the watchlist (whole token, title, description and link).
  data_law:
    - 2023/2854
    - 2022/868
    - 2022/2555
    - Data Act
    - Data Governance Act
    - NIS2
    - NIS 2
  feeds:
    # The AI Office's news, on the Commission's digital-strategy site; ~10 items.
    - name: European Commission
      url: https://digital-strategy.ec.europa.eu/en/rss.xml
      jurisdiction: eu
    # EU data protection board; ~10 items. AI-relevant items often name no AI
    # term (a fine for automated decision-making), so all go to Jev.
    - name: EDPB
      url: https://www.edpb.europa.eu/feed/news_en
      jurisdiction: eu
      jev_only: true
    # Dutch AI supervisor (data protection); ~1.4 a week, AI items often name no AI term.
    - name: Autoriteit Persoonsgegevens
      url: https://www.autoriteitpersoonsgegevens.nl/rss.xml
      jurisdiction: nl
      jev_only: true
    # All ministries' news (AI news comes from education, justice, defence too, not
    # only BZK/EZK); the newest 20, ~4 a day. The old feed URLs broke 2026-06-02.
    # Not resultSearchTerm: it ranks by relevance, not date.
    - name: Rijksoverheid
      url: https://www.rijksoverheid.nl/api/rss
      query:
        &rijksoverheid_news {
          filters: [{ field: content_type, values: ["pro:newsDocument"], type: all }],
          resultSearchTerm: "",
          pageTitle: Nieuws,
        }
      jurisdiction: nl
      jev_only: true
    # AI Act market-surveillance co-coordinator, same platform and query; ~1 a week.
    - name: RDI
      url: https://www.rdi.nl/api/rss
      query: *rijksoverheid_news
      jurisdiction: nl
      jev_only: true
    # BZK's channel for government digitalisation and AI guidance; ~5 a week.
    - name: Digitale Overheid
      url: https://www.digitaleoverheid.nl/feed/
      jurisdiction: nl
      jev_only: true
    # News & commentary (kind: news), measured 2026-09-29..10-13 and live-checked
    # 2026-10-14; posts a week before Jev. Euractiv (403) and Lawfare had no
    # usable feed; Tech Policy Press and IAPP feeds were not found. The EU AI Act
    # Newsletter (Substack) was dropped 2026-10-16: HTTP 403 to every Actions run.
    # ~12 a week, ~7 about AI; EU AI policy.
    - name: Politico Europe
      url: https://www.politico.eu/section/technology/feed/
      jurisdiction: eu
      kind: news
    # ~12 a week, ~8 about AI; US federal and state attorneys general.
    - name: Politico US
      url: https://rss.politico.com/technology.xml
      jurisdiction: us_federal
      kind: news
    # US AI policy and safety; ~3 a week.
    - name: Transformer
      url: https://www.transformernews.ai/feed
      jurisdiction: us_federal
      kind: news
    # Georgetown CSET analysis (export controls, chips); ~4 a week.
    - name: CSET
      url: https://cset.georgetown.edu/feed/
      jurisdiction: us_federal
      kind: news
    # Covington's Inside Privacy: US state-law round-ups; ~2 a week. Its Inside
    # Tech Media blog overlaps, so only this one.
    - name: Covington Inside Privacy
      url: https://www.insideprivacy.com/feed/
      jurisdiction: us_federal
      kind: news
    # Dutch public administration news; ~50 a week, ~3 about AI. No guid: keyed on the link.
    - name: Binnenlands Bestuur
      url: https://www.binnenlandsbestuur.nl/feeds/articles.rss
      jurisdiction: nl
      kind: news
  # Dated milestones for the "Upcoming deadlines" section, shown in the 30 days
  # before. AI Act dates as amended by the Digital Omnibus on AI (OJ 2026-07-24),
  # from the Commission's AI Act Service Desk timeline, read 2026-10-14.
  calendar:
    - date: 2026-12-02
      label: "AI Act: bans on sexual deepfakes and CSAM generators; Art. 50(2) transition ends"
      link: https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
    - date: 2027-08-02
      label: "AI Act: one AI regulatory sandbox per Member State operational"
      link: https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
    - date: 2027-12-02
      label: "AI Act: high-risk rules (Annex III) apply"
      link: https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
    - date: 2028-08-02
      label: "AI Act: high-risk rules for products under Annex I apply"
      link: https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
