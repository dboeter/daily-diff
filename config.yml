# Daily Diff configuration
# Edit this file to customize which repositories are tracked.
# Changes take effect on the next workflow run.

# ── AI agents ─────────────────────────────────────────────────────────────────
# Coding agents and personal AI assistants, CLI or not, in one daily report.
# Each agent is covered by its stable releases, a few hot issues (high
# engagement or a regression/security label) and news: HN, Anthropic/OpenAI and
# GitHub Trending items that mention it. Issue and PR churn is not reported.
# Each entry requires: id (slug), repo (owner/repo), name (display name).
# Optional keywords: terms to match in news items. Without them the display
# name and repo name are used. Set them when the name is a common word.

agents:
  - id: claude-code
    repo: anthropics/claude-code
    name: Claude Code
  - id: codex
    repo: openai/codex
    name: OpenAI Codex
    keywords: [codex]
  - id: gemini-cli
    repo: google-gemini/gemini-cli
    name: Gemini CLI
  - id: copilot-cli
    repo: github/copilot-cli
    name: GitHub Copilot CLI
    keywords: [copilot cli]
  - id: opencode
    repo: anomalyco/opencode
    name: OpenCode
  - id: pi
    repo: earendil-works/pi
    name: Pi
    # "pi" alone matches Raspberry Pi and every other use of the word.
    keywords: [pi coding agent, pi agent, earendil]
  - id: qwen-code
    repo: QwenLM/qwen-code
    name: Qwen Code
  - id: openclaw
    repo: openclaw/openclaw
    name: OpenClaw
  - id: hermes-agent
    repo: nousresearch/hermes-agent
    name: Hermes Agent
  - id: ironclaw
    repo: nearai/ironclaw
    name: IronClaw
  - id: qwenpaw
    repo: agentscope-ai/QwenPaw
    name: QwenPaw
  - id: zeroclaw
    repo: zeroclaw-labs/zeroclaw
    name: ZeroClaw

# ── Claude Code Skills ────────────────────────────────────────────────────────
# No date filter, sorted by community engagement. A section of the weekly
# ai-trending report.

skills_repo: anthropics/skills

# ── AI infrastructure ─────────────────────────────────────────────────────────
# Inference engines, gateways and fine-tuning frameworks that the agents run on
# top of. Weekly ai-infra report: stable releases and hot issues of the last 7
# days, same pipeline as the agents report (no news matching).

infra_repos:
  - id: vllm
    repo: vllm-project/vllm
    name: vLLM
  - id: sglang
    repo: sgl-project/sglang
    name: SGLang
  - id: llama-cpp
    repo: ggml-org/llama.cpp
    name: llama.cpp
  - id: ollama
    repo: ollama/ollama
    name: Ollama
  - id: litellm
    repo: BerriAI/litellm
    name: LiteLLM
  - id: unsloth
    repo: unslothai/unsloth
    name: Unsloth
